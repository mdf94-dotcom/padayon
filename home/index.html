<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Practice</title>
<meta name="description" content="Bisaya, vocabulary, chess, and workouts in one place.">
<meta name="theme-color" content="#14181B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: the app fills the screen; a bottom tab bar switches between the Today page and each app, and each app stays loaded in its own frame. */
:root{
  --bg:#F0F1F2; --surface:#FFFFFF; --ink:#171B1E; --muted:#596168; --line:#D7DBDF; --chip:#E4E7EA;
  --sea:#0B6B66; --sea-soft:#D3E9E6; --ind:#3340A0; --ind-soft:#DEE1F5; --moss:#4A7A3D; --moss-soft:#E3EDDC; --ember:#B4583C; --ember-soft:#F4E0D8;
  --good:#1F7D49; --good-bg:#DCF0E3; --bad:#B8354A; --bad-bg:#F8DEE2;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --nav:64px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101315; --surface:#181D20; --ink:#E5E9EC; --muted:#9AA3AA; --line:#2A3136; --chip:#20272B;
  --sea:#43B9AF; --sea-soft:#163834; --ind:#9AA4FF; --ind-soft:#252B55; --moss:#8FC27C; --moss-soft:#1F2E1C; --ember:#E59272; --ember-soft:#3A241B;
  --good:#52CB87; --good-bg:#11301F; --bad:#F27B8E; --bad-bg:#3B1820; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow:hidden}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.label{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.small{font-size:.86rem}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* frames */
.stage{position:fixed;inset:0 0 calc(var(--nav) + env(safe-area-inset-bottom,0px)) 0}
.stage > *{position:absolute;inset:0;width:100%;height:100%;border:0}
iframe{background:var(--bg)}
#today{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
.page{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-block:18px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:5}
nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--muted);position:relative}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--c,var(--ink))}
nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--c,var(--ink))}
nav button .dot{position:absolute;top:10px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--good);border:2px solid var(--surface)}

/* today */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{font-size:2rem;font-weight:800}
.count{font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.meter{display:flex;gap:6px}
.meter i{flex:1;height:8px;border-radius:99px;background:var(--chip)}
.meter i.on{background:var(--good)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{--c:var(--ink);--cs:var(--chip);display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.sea{--c:var(--sea);--cs:var(--sea-soft)}.item.ind{--c:var(--ind);--cs:var(--ind-soft)}.item.moss{--c:var(--moss);--cs:var(--moss-soft)}.item.ember{--c:var(--ember);--cs:var(--ember-soft)}
.ico{width:44px;height:44px;border-radius:12px;background:var(--cs);color:var(--c);display:grid;place-items:center;grid-row:span 2;position:relative}
.ico svg{width:24px;height:24px}
.ico .ok{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:var(--good);color:var(--surface);display:grid;place-items:center;border:2px solid var(--surface)}
.ico .ok svg{width:11px;height:11px}
.item h2{font-size:1.08rem}
.item .st{font-size:.88rem;color:var(--muted);min-width:0;grid-column:2}
.item .st b{color:var(--ink)}
.item.done .st b{color:var(--good)}
.go{grid-row:span 2;grid-column:3;border:0;border-radius:11px;padding:9px 14px;font-weight:700;background:var(--c);color:var(--surface);white-space:nowrap}
.item.done .go{background:var(--chip);color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;grid-template-columns:72px repeat(14,minmax(0,1fr));gap:4px;align-items:center}
.grid .rl{font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid i{aspect-ratio:1;border-radius:4px;background:var(--chip);display:block;max-width:100%}
.grid i.on{background:var(--c)}
.grid i.t{outline:2px solid var(--ink);outline-offset:1px}
.grid i.rest{background:repeating-linear-gradient(135deg,var(--chip) 0 3px,color-mix(in srgb,var(--ember) 30%,var(--chip)) 3px 6px)}
.grid .dl{font-size:.68rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--chip);min-height:42px}
.btn.primary{background:var(--ink);color:var(--surface)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.note{font-size:.88rem;padding:10px 12px;border-radius:10px;background:var(--chip)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.good{background:var(--good-bg);color:var(--good)}
details > summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"+";color:var(--muted)}
details[open] > summary::after{content:"–"}
.set{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line);margin-top:12px}
.set:first-of-type{border-top:0;margin-top:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 12px;font-weight:700}
.seg button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.flow{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;z-index:6}
.flow .msg{flex:1;min-width:160px}
.flow .msg b{font-family:var(--f-display)}
.nextup{--c:var(--ink);background:var(--c);color:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.nextup .label{color:inherit;opacity:.85}
.nextup h2{font-size:1.4rem}
.nextup .btn{background:var(--surface);color:var(--c)}
.nextup .btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;max-width:calc(100% - 32px)}
@media (max-width:420px){.grid{grid-template-columns:56px repeat(14,minmax(0,1fr));gap:3px}.top h1{font-size:1.7rem}}
</style>
</head>
<body>
<div class="stage" id="stage"><div id="today"><div class="page" id="page"></div></div></div>
<nav id="nav" aria-label="Apps"></nav>
<div class="flow" id="flow" hidden role="status"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="shared/cloud.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const dayAt = n => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return d; };
const pday = d => Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5); // Padayon's day numbers
const ls = {get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }};
function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }
const I = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="m9 15 2 2 4-4"/></svg>',
  bisaya:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M9 10h6M9 14h4"/></svg>',
  words:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Z"/><path d="M4 19a2 2 0 0 1 2-2h13"/></svg>',
  chess:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3h1.5v1.5H12V3h1.5v1.5H15V3h1.5v4l-1.5 1.5V14l1.5 2v1H7.5v-1L9 14V8.5L7.5 7V3H9Zm-2.5 15.5h11V21h-11v-2.5Z"/></svg>',
  lift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>'
};

/* ---------- reading each app's progress (this device, or your account if that copy is newer) ---------- */
function newest(localKey, field){ const a = ls.get(localKey), b = window.Cloud && Cloud.get(field); if (!a) return b; if (!b) return a; return (b.updated || 0) > (a.updated || 0) ? b : a; }
const chessOk = d => !!(d && (d.session || (d.warmDone && (d.opening || d.game))));
const APPS = [
  {k:'bisaya', name:'Padayon', tab:'Bisaya', cls:'sea', color:'--sea', src:'/padayon/',
    did(off){ const s = newest('padayon-app-v1', 's'); if (!s) return false; const n = pday(dayAt(off));
      if (off === 0) return !!(s.plan && s.plan[n] && s.plan[n].session); return !!(s.xp && s.xp[n] > 0); },
    line(){ const s = newest('padayon-app-v1', 's'); if (!s) return 'Not started on this site yet'; const t = pday(dayAt(0)), st = s.streak || {};
      const n = (st.last === t || st.last === t - 1) ? st.count : 0; return `${n} day streak${s.xp && s.xp[t] ? ` · ${s.xp[t]} XP today` : ''}`; }},
  {k:'words', name:'Word Hoard', tab:'Words', cls:'ind', color:'--ind', src:'words/',
    did(off){ const s = newest('wordhoard.v1', 'words'); return !!(s && s.days && s.days[ymd(dayAt(off))]?.done); },
    line(){ const s = newest('wordhoard.v1', 'words'); if (!s) return 'Start your first session'; const t = ymd(); const due = Object.values(s.cards || {}).filter(c => c.due <= t).length;
      return `${Object.values(s.cards || {}).filter(c => c.b >= 1).length} words learned · ${due} due`; }},
  {k:'chess', name:'Brick by Brick Chess', tab:'Chess', cls:'moss', color:'--moss', src:'chess/',
    did(off){ const s = newest('bbchess-v2', 'chess'); return chessOk(s && s.days && s.days[ymd(dayAt(off))]); },
    line(){ const s = newest('bbchess-v2', 'chess'); if (!s) return 'Open it to load your progress'; const d = (s.days || {})[ymd()] || {};
      const parts = [d.warmDone ? 'warm-up ✓' : 'warm-up', d.opening ? 'opening ✓' : 'opening', d.game ? 'game ✓' : 'game']; return parts.join(' · '); }}
];

/* ---------- Hevy ---------- */
const H = {key: ls.get('practice.hevyKey') || '', goal: ls.get('practice.goal') || 5, rest: ls.get('practice.rest') || [3, 6], // rest days: 0 = Sunday … 3 = Wednesday, 6 = Saturday
  cache: ls.get('practice.hevyCache'), busy:false, err:''};
const localDay = iso => ymd(new Date(iso));
async function hevyFetch(force){
  if (!H.key || H.busy) return;
  if (!force && H.cache && Date.now() - H.cache.at < 5 * 60e3) return;
  H.busy = true; H.err = ''; renderToday();
  try{
    const out = [];
    for (const page of [1, 2]){
      const r = await fetch(`https://api.hevyapp.com/v1/workouts?page=${page}&pageSize=10`, {headers: {'api-key': H.key, 'accept': 'application/json'}});
      if (r.status === 401) throw new Error('key');
      if (r.status === 403) throw new Error('pro');
      if (r.status === 404 && page > 1) break;
      if (!r.ok) throw new Error('http ' + r.status);
      const j = await r.json(); const ws = j.workouts || [];
      ws.forEach(w => out.push({title: w.title || 'Workout', start: w.start_time, end: w.end_time, n: (w.exercises || []).length}));
      if (!ws.length || page >= (j.page_count || 1) || localDay(ws[ws.length - 1].start_time) < ymd(dayAt(-14))) break;
    }
    H.cache = {at: Date.now(), workouts: out}; ls.set('practice.hevyCache', H.cache);
  }catch(e){
    H.err = e.message === 'key' ? 'Hevy didn’t accept that API key. Copy it again from Hevy’s Developer settings.'
      : e.message === 'pro' ? 'Hevy says this account can’t use the API. API access needs Hevy Pro.'
      : e instanceof TypeError ? 'Hevy blocked the request from this site. This needs a small relay set up; tell Claude “Hevy is blocked”.'
      : 'Couldn’t reach Hevy (' + esc(e.message) + '). Try Refresh in a minute.';
  }
  H.busy = false; renderToday();
}
const workoutsOn = off => (H.cache?.workouts || []).filter(w => w.start && localDay(w.start) === ymd(dayAt(off)));
const isRest = off => H.rest.includes(dayAt(off).getDay());
function weekCount(){ const now = dayAt(0), dow = (now.getDay() + 6) % 7; let n = 0; for (let i = 0; i <= dow; i++) if (workoutsOn(-i).length) n++; return n; }

/* ---------- views ---------- */
const TABS = [{k:'today', label:'Today', color:'--ink'}].concat(APPS.map(a => ({k:a.k, label:a.tab, color:a.color})));
let tab = 'today';
const frames = {};
function show(k){
  if (!TABS.some(t => t.k === k)) k = 'today';
  tab = k;
  $('#today').hidden = k !== 'today';
  APPS.forEach(a => {
    if (a.k === k && !frames[a.k]){
      const f = document.createElement('iframe'); f.src = a.src; f.title = a.name; f.allow = 'microphone; autoplay; clipboard-write';
      f.addEventListener('load', () => { f.dataset.loaded = '1'; });
      $('#stage').appendChild(f); frames[a.k] = f;
    }
    if (frames[a.k]) frames[a.k].hidden = a.k !== k;
  });
  if (k === 'today'){ renderToday(); hevyFetch(false); }
  renderNav();
  if (location.hash.slice(1) !== k) history.replaceState(null, '', '#' + k);
}
function renderNav(){
  $('#nav').innerHTML = TABS.map(t => { const a = APPS.find(x => x.k === t.k);
    return `<button data-tab="${t.k}" class="${tab === t.k ? 'on' : ''}" style="--c:var(${t.color})" aria-current="${tab === t.k ? 'page' : 'false'}">${I[t.k]}${a && a.did(0) ? '<span class="dot" aria-label="done today"></span>' : ''}${t.label}</button>`; }).join('');
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; renderToday(); });
const ui = {open: !H.key ? false : false};
function renderToday(){
  if (tab !== 'today') { renderNav(); return; }
  const date = new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
  const done = APPS.filter(a => a.did(0)).length;
  const wToday = workoutsOn(0), restToday = isRest(0), wDone = wToday.length > 0 || restToday;
  const total = APPS.length + (H.key ? 1 : 0), got = done + (H.key && wDone ? 1 : 0);
  const rows = APPS.map(a => { const d = a.did(0);
    return `<div class="item ${a.cls} ${d ? 'done' : ''}"><div class="ico" aria-hidden="true">${I[a.k]}${d ? `<span class="ok">${I.check}</span>` : ''}</div>
      <h2>${a.name}</h2><button class="go" ${d ? `data-tab="${a.k}"` : `data-start="${a.k}"`}>${d ? 'Open' : 'Start'}</button>
      <div class="st"><b>${d ? 'Done today' : 'Not yet'}</b> · ${esc(a.line())}</div></div>`; }).join('');
  let wline;
  if (!H.key) wline = `<b>Not connected</b> · add your Hevy key below`;
  else if (H.err) wline = `<b>Can’t check</b> · see the note below`;
  else if (H.busy && !H.cache) wline = `<b>Checking Hevy…</b>`;
  else if (wToday.length){ const w = wToday[0], min = w.end ? Math.round((new Date(w.end) - new Date(w.start)) / 60000) : null;
    wline = `<b>Logged</b> · ${esc(w.title)}${min ? ` · ${min} min` : ''}${w.n ? ` · ${w.n} exercises` : ''} · ${weekCount()} of ${H.goal} this week`; }
  else if (restToday) wline = `<b>Rest day</b> · ${weekCount()} of ${H.goal} this week`;
  else wline = `<b>No workout logged yet</b> · ${weekCount()} of ${H.goal} this week`;
  const lift = `<div class="item ember ${wDone ? 'done' : ''}"><div class="ico" aria-hidden="true">${I.lift}${wDone ? `<span class="ok">${I.check}</span>` : ''}</div>
    <h2>${restToday && !wToday.length ? 'Rest day' : 'Workout'}</h2><button class="go" data-a="${H.key ? 'hrefresh' : 'hsetup'}">${H.key ? (H.busy ? 'Checking' : 'Refresh') : 'Connect'}</button>
    <div class="st">${wline}</div></div>`;
  const days = Array.from({length:14}, (_, i) => i - 13);
  const grow = (label, color, fn, rest) => `<span class="rl">${label}</span>` + days.map(o => `<i style="--c:var(${color})" class="${fn(o) ? 'on' : rest && rest(o) ? 'rest' : ''} ${o === 0 ? 't' : ''}" title="${rest && rest(o) && !fn(o) ? 'Rest day' : ''}"></i>`).join('');
  const grid = `<span></span>` + days.map(o => `<span class="dl">${o === 0 || o === -7 || o === -13 ? dayAt(o).getDate() : ''}</span>`).join('')
    + APPS.map(a => grow(a.tab, a.color, o => a.did(o))).join('') + (H.key && H.cache ? grow('Workout', '--ember', o => workoutsOn(o).length, isRest) : '');
  const signed = window.Cloud && Cloud.user;
  $('#page').innerHTML = `
  <header class="top"><div><div class="label">${date}</div><h1>${got === total ? 'All done today' : 'Daily Practice'}</h1></div>
    <span class="count tnum">${got} of ${total} done</span></header>
  <div class="meter" aria-hidden="true">${Array.from({length: total}, (_, i) => `<i class="${i < got ? 'on' : ''}"></i>`).join('')}</div>
  ${FL.next ? nextCard() : ''}
  <div class="list">${rows}${lift}</div>
  ${H.err ? `<div class="note bad" role="alert">${H.err}</div>` : ''}
  ${!signed && window.Cloud && Cloud.ready ? `<div class="note">Sign in with Google (the same account as Padayon) so every app syncs between your phone and PC. <button class="btn primary" data-a="signin" style="margin-top:8px;display:block">Sign in with Google</button></div>` : ''}
  <section class="panel"><div class="top"><h2 style="font-size:1.1rem">Last 14 days</h2><span class="small muted">Today is outlined${H.key && H.cache ? ' · striped = rest day' : ''}</span></div><div class="grid">${grid}</div></section>
  <section class="panel"><details id="setdet" ${ui.open ? 'open' : ''}><summary>Settings</summary>
    <div class="set"><b>Account</b><span class="small muted">${signed ? `Signed in as ${esc(Cloud.user.email || 'your Google account')}. Padayon, Word Hoard, and chess all sync to this account.` : 'Not signed in. Progress is saved on this device only.'}${window.Cloud && Cloud.err ? ` Last sync error: ${esc(Cloud.err)}` : ''}</span>
      <div><button class="btn" data-a="${signed ? 'signout' : 'signin'}">${signed ? 'Sign out' : 'Sign in with Google'}</button></div></div>
    <div class="set" id="hevyset"><b>Hevy</b><span class="small muted">Needs Hevy Pro. In Hevy on the web, open Settings → Developer, create an API key, and paste it here. The key stays on this device.</span>
      <div class="row"><input class="field" id="hkey" type="password" autocomplete="off" placeholder="Hevy API key" value="${esc(H.key)}" aria-label="Hevy API key"><button class="btn primary" data-a="hsave">Save</button></div>
      ${H.key ? `<div><button class="btn" data-a="hremove">Remove key</button></div>` : ''}
      <span class="small muted">Rest days (count as done on the Today page)</span>
      <div class="seg" role="group" aria-label="Rest days">${[1,2,3,4,5,6,0].map(d => `<button data-a="rest" data-d="${d}" class="${H.rest.includes(d) ? 'on' : ''}" aria-pressed="${H.rest.includes(d)}">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]}</button>`).join('')}</div>
      <span class="small muted">Workouts per week</span>
      <div class="seg">${[3,4,5,6].map(n => `<button data-a="goal" data-n="${n}" class="${H.goal === n ? 'on' : ''}">${n}</button>`).join('')}</div></div>
    <div class="set"><b>Install</b><span class="small muted">${installEvt ? 'Add Daily Practice to this device so it opens like an app.' : 'On iPhone: tap Share, then Add to Home Screen. On Android or PC (Chrome or Edge): use the install icon in the address bar or the browser menu.'}</span>
      ${installEvt ? `<div><button class="btn" data-a="install">Install app</button></div>` : ''}</div>
  </details></section>`;
  renderNav();
}

/* ---------- finishing one app: back to Today, then on to the next ---------- */
const FL = {prev: {}, timer: null, next: null, left: 0};
APPS.forEach(a => FL.prev[a.k] = a.did(0));
const order = a => APPS.indexOf(a);
function nextApp(after){ for (let i = 1; i <= APPS.length; i++){ const a = APPS[(order(after) + i) % APPS.length]; if (!a.did(0)) return a; } return null; }
function stopFlow(){ clearInterval(FL.timer); FL.timer = null; }
function checkFinished(){
  APPS.forEach(a => { const now = a.did(0); if (now && !FL.prev[a.k] && tab === a.k) finished(a); FL.prev[a.k] = now; });
}
function finished(a){
  if (FL.cur === a.k && !$('#flow').hidden) return;
  FL.cur = a.k; stopFlow(); FL.left = 6; const nx = nextApp(a);
  const bar = $('#flow');
  const draw = () => { bar.innerHTML = `<div class="msg"><b>${a.name} done.</b> <span class="muted">Back to Today in ${FL.left}${nx ? `, then ${esc(nx.name)}` : ''}.</span></div>
    <button class="btn" data-a="flowstay">Stay here</button><button class="btn primary" data-a="flowgo">Go now</button>`; };
  FL.pending = nx; draw(); bar.hidden = false;
  FL.timer = setInterval(() => { FL.left--; if (FL.left <= 0) backHome(); else draw(); }, 1000);
}
function backHome(){
  stopFlow(); $('#flow').hidden = true; FL.cur = null;
  FL.next = FL.pending || null; FL.pending = null;
  show('today'); $('#today').scrollTop = 0;
  if (FL.next){ FL.left = 3; renderToday(); FL.timer = setInterval(() => { FL.left--; if (FL.left <= 0){ const n = FL.next; FL.next = null; stopFlow(); startApp(n.k); } else renderToday(); }, 1000); }
}
function nextCard(){ const a = FL.next;
  return `<section class="nextup" style="--c:var(${a.color})"><div class="label">Next up</div><h2>${a.name}</h2>
    <span>Starting in ${FL.left}…</span><div class="row"><button class="btn" data-a="nextnow">Start now</button><button class="btn ghost" data-a="nextcancel">Not now</button></div></section>`; }
function startApp(k){
  stopFlow(); FL.next = null; show(k);
  const f = frames[k]; if (!f) return;
  const go = () => setTimeout(() => { try{ const w = f.contentWindow; const fn = w && (w.startFromHome || w.startSession); if (typeof fn === 'function') fn('daily'); }catch(e){} }, 900);
  if (f.dataset.loaded) go(); else f.addEventListener('load', go, {once:true});
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const st = e.target.closest('[data-start]'); if (st){ startApp(st.dataset.start); return; }
  const t = e.target.closest('[data-tab]'); if (t){ if (FL.next){ FL.next = null; stopFlow(); } show(t.dataset.tab); return; }
  const b = e.target.closest('[data-a]'); if (!b) return;
  switch (b.dataset.a){
    case 'signin': try{ await Cloud.signIn(); }catch(err){ toast(err.message || 'Sign-in failed'); } break;
    case 'signout': await Cloud.signOut(); toast('Signed out. Progress stays on this device.'); break;
    case 'hsetup': ui.open = true; renderToday(); $('#hkey').focus(); $('#hevyset').scrollIntoView({behavior:'smooth', block:'center'}); break;
    case 'hsave': { const v = $('#hkey').value.trim(); if (!v){ toast('Paste your Hevy API key first.'); return; } H.key = v; ls.set('practice.hevyKey', v); H.cache = null; ui.open = true; await hevyFetch(true); if (!H.err) toast('Hevy connected'); break; }
    case 'hremove': H.key = ''; H.cache = null; H.err = ''; try{ localStorage.removeItem('practice.hevyKey'); localStorage.removeItem('practice.hevyCache'); }catch(_){ } renderToday(); break;
    case 'hrefresh': hevyFetch(true); break;
    case 'flowgo': backHome(); break;
    case 'flowstay': stopFlow(); FL.pending = null; FL.cur = null; $('#flow').hidden = true; break;
    case 'nextnow': { const n = FL.next; startApp(n.k); break; }
    case 'nextcancel': FL.next = null; stopFlow(); renderToday(); break;
    case 'rest': { const d = +b.dataset.d; H.rest = H.rest.includes(d) ? H.rest.filter(x => x !== d) : H.rest.concat(d); ls.set('practice.rest', H.rest);
      H.goal = Math.min(6, Math.max(3, 7 - H.rest.length)); ls.set('practice.goal', H.goal); renderToday(); break; }
    case 'goal': H.goal = +b.dataset.n; ls.set('practice.goal', H.goal); renderToday(); break;
    case 'install': if (installEvt){ installEvt.prompt(); installEvt = null; renderToday(); } break;
  }
});
document.addEventListener('toggle', e => { if (e.target.id === 'setdet') ui.open = e.target.open; }, true);
window.addEventListener('storage', () => { checkFinished(); renderToday(); });
// Each app sends this when you finish its daily session, even if it was already done earlier today.
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.practice !== 'done') return;
  const a = APPS.find(x => x.k === e.data.app); if (!a || tab !== a.k) return;
  FL.prev[a.k] = true; renderNav(); finished(a);
});
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
document.addEventListener('visibilitychange', () => { if (!document.hidden && tab === 'today'){ renderToday(); hevyFetch(false); } });
if (window.Cloud) Cloud.on(() => { checkFinished(); renderToday(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
show(location.hash.slice(1) || 'today');
</script>
</body>
