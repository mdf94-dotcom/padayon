<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Practice</title>
<meta name="description" content="Bisaya, vocabulary, chess, and workouts in one place.">
<meta name="theme-color" content="#0b0f12">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: an always-dark Today page — greeting and a progress ring, then one card per app grouped into Practice and Body & style,
   then a 14-day streak grid. Inside an app, a slim top bar leads back here. Palette borrows Padayon's iridescent ribbon. */
:root{
  --bg:#0b0f12; --surface:#13191d; --surface-2:#1a2227; --line:#232d33; --ink:#eef2ef; --muted:#8d9b97; --chip:#1c252a;
  --sea:#3fc4b1; --ind:#9ea8ff; --moss:#95cb80; --ember:#f2946e; --plum:#d8a1e8;
  --good:#79d9a0; --good-bg:#14301f; --bad:#f28c9b; --bad-bg:#371b22;
  --iri:linear-gradient(115deg,#e98aa6 0%,#e8df7a 42%,#93d99a 72%,#34b8a3 100%);
  --f-display:"Fredoka","Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.005em;text-wrap:balance;font-weight:600}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.small{font-size:.86rem}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* frames + the bar inside an app */
.stage{position:fixed;inset:0}
.stage.inapp{top:calc(46px + env(safe-area-inset-top,0px))}
.stage > *{position:absolute;inset:0;width:100%;height:100%;border:0}
.appbar{position:fixed;left:0;right:0;top:0;z-index:5;height:calc(46px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line)}
.appbar button{justify-self:start;border:0;background:transparent;color:inherit;font-weight:700;display:flex;align-items:center;gap:2px;padding:8px 10px;border-radius:10px;min-height:40px}
.appbar button svg{width:20px;height:20px}
.appbar .an{font-family:var(--f-display);font-weight:600;font-size:1rem}
.appbar.bisaya{background:#0f1719;color:#f3f1e4;border-bottom-color:#2a4245}
.appbar.words{background:#EEF0F6;color:#171A2E;border-bottom-color:#D5D9E6}
.appbar.chess{background:#ffffff;color:#161d17;border-bottom-color:#d8dcd2}
@media (prefers-color-scheme: dark){.appbar.words{background:#0F1120;color:#E6E8F3;border-bottom-color:#2A2E47}.appbar.chess{background:#171e18;color:#e7ece5;border-bottom-color:#2a352c}}
iframe{background:var(--bg)}
iframe.bisaya{background:#0f1719}
iframe.words{background:#EEF0F6}
iframe.chess{background:#f1f2ed}
@media (prefers-color-scheme: dark){iframe.words{background:#0F1120}iframe.chess{background:#0f1410}}

/* today */
#today{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);
  background:radial-gradient(120% 60% at 0% 0%,rgba(63,196,177,.13),transparent 60%),radial-gradient(90% 50% at 100% 0%,rgba(216,161,232,.10),transparent 60%),var(--bg)}
.page{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:22px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:4px 2px 10px}
.hero h1{font-size:clamp(1.9rem,8vw,2.4rem);line-height:1.05;margin-top:6px}
.hero h1 em{font-style:normal;background:var(--iri);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:6px 0 0;color:var(--muted);font-size:.95rem}
.ring{position:relative;width:92px;height:92px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .num b{font-family:var(--f-display);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.ring .num small{display:block;font-size:.68rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
@media (prefers-reduced-motion:no-preference){.ring .arc{transition:stroke-dashoffset .6s cubic-bezier(.3,.7,.3,1)}}
.group{display:flex;flex-direction:column;gap:10px}
.group > .label{padding:8px 4px 0}
.item{--c:var(--ink);display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;position:relative}
.item.sea{--c:var(--sea)}.item.ind{--c:var(--ind)}.item.moss{--c:var(--moss)}.item.ember{--c:var(--ember)}.item.plum{--c:var(--plum)}
.item.done{border-color:color-mix(in srgb,var(--c) 30%,var(--line));background:linear-gradient(90deg,color-mix(in srgb,var(--c) 7%,var(--surface)),var(--surface) 65%)}
.ico{width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c);display:grid;place-items:center;grid-row:span 2;position:relative}
.ico svg{width:24px;height:24px}
.item.done .ico{background:var(--c);color:var(--bg)}
.ico .ok{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:var(--good);color:var(--bg);display:grid;place-items:center;border:3px solid var(--surface)}
.ico .ok svg{width:11px;height:11px}
.item h2{font-size:1.1rem}
.item .st{font-size:.86rem;color:var(--muted);min-width:0;grid-column:2}
.item .st b{color:var(--ink);font-weight:700}
.item.done .st b{color:var(--good)}
.go{grid-row:span 2;grid-column:3;border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:.92rem;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--c);white-space:nowrap;min-height:40px}
.go:hover{background:color-mix(in srgb,var(--c) 26%,var(--surface))}
.item:not(.done) .go.lead{background:var(--c);color:var(--bg)}
.item.done .go{background:transparent;border:1px solid var(--line);color:var(--muted)}
a.go{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ptop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ptop h2{font-size:1.1rem}
.grid{display:grid;grid-template-columns:64px repeat(14,minmax(0,1fr));gap:4px;align-items:center}
.grid .rl{font-size:.76rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid i{aspect-ratio:1;border-radius:5px;background:var(--chip);display:block;max-width:100%}
.grid i.on{background:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 35%,transparent)}
.grid i.t{outline:1.5px solid var(--ink);outline-offset:1.5px}
.grid i.rest{background:repeating-linear-gradient(135deg,var(--chip) 0 3px,color-mix(in srgb,var(--ember) 32%,var(--chip)) 3px 6px)}
.grid .dl{font-size:.66rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:700;background:var(--surface-2);min-height:42px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.note{font-size:.88rem;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.note.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.signin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
details > summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .2s}
details[open] > summary::after{transform:rotate(-135deg) translateY(-3px)}
.set{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line);margin-top:14px}
.set:first-of-type{border-top:0;margin-top:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;max-width:calc(100% - 32px)}
@media (max-width:420px){.grid{grid-template-columns:54px repeat(14,minmax(0,1fr));gap:3px}.ring{width:80px;height:80px}.ring .num b{font-size:1.45rem}}
</style>
</head>
<body>
<div class="stage" id="stage"><div id="today"><div class="page" id="page"></div></div></div>
<header class="appbar" id="appbar" hidden><button data-a="home" aria-label="Back to Today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>Today</button><span class="an" id="appname"></span><span></span></header>
<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="shared/cloud.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const dayAt = n => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return d; };
const pday = d => Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5); // Padayon's day numbers
const ls = {get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }};
function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }
const I = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="m9 15 2 2 4-4"/></svg>',
  bisaya:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M9 10h6M9 14h4"/></svg>',
  words:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Z"/><path d="M4 19a2 2 0 0 1 2-2h13"/></svg>',
  chess:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3h1.5v1.5H12V3h1.5v1.5H15V3h1.5v4l-1.5 1.5V14l1.5 2v1H7.5v-1L9 14V8.5L7.5 7V3H9Zm-2.5 15.5h11V21h-11v-2.5Z"/></svg>',
  hanger:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7.5a2 2 0 1 1 2-2"/><path d="M12 7.5v1.2L3.6 15a1.6 1.6 0 0 0 1 2.9h14.8a1.6 1.6 0 0 0 1-2.9L12 8.7"/></svg>',
  lift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>'
};

/* ---------- reading each app's progress (this device, or your account if that copy is newer) ---------- */
function newest(localKey, field){ const a = ls.get(localKey), b = window.Cloud && Cloud.get(field); if (!a) return b; if (!b) return a; return (b.updated || 0) > (a.updated || 0) ? b : a; }
const chessOk = d => !!(d && (d.session || (d.warmDone && (d.opening || d.game))));
const APPS = [
  {k:'bisaya', name:'Padayon', tab:'Bisaya', cls:'sea', color:'--sea', src:'/padayon/',
    did(off){ const s = newest('padayon-app-v1', 's'); if (!s) return false; const n = pday(dayAt(off));
      // Padayon's "Start the next day" moves its plan ahead, which only happens after today is finished
      if (off === 0){ const plan = s.plan || {}; return !!(plan[n] && plan[n].session) || Object.keys(plan).some(k => +k > n); }
      return !!(s.xp && s.xp[n] > 0); },
    line(){ const s = newest('padayon-app-v1', 's'); if (!s) return 'Not started on this site yet'; const t = pday(dayAt(0)), st = s.streak || {};
      const n = (st.last === t || st.last === t - 1) ? st.count : 0; return `${n} day streak${s.xp && s.xp[t] ? ` · ${s.xp[t]} XP today` : ''}`; }},
  {k:'words', name:'Word Hoard', tab:'Words', cls:'ind', color:'--ind', src:'words/',
    did(off){ const s = newest('wordhoard.v1', 'words'); return !!(s && s.days && s.days[ymd(dayAt(off))]?.done); },
    line(){ const s = newest('wordhoard.v1', 'words'); if (!s) return 'Start your first session'; const t = ymd(); const due = Object.values(s.cards || {}).filter(c => c.due <= t).length;
      const n = Object.values(s.cards || {}).filter(c => c.b >= 1).length; return `${n} word${n === 1 ? '' : 's'} learned · ${due} due`; }},
  {k:'chess', name:'Brick by Brick Chess', tab:'Chess', cls:'moss', color:'--moss', src:'chess/',
    did(off){ const s = newest('bbchess-v2', 'chess'); return chessOk(s && s.days && s.days[ymd(dayAt(off))]); },
    line(){ const s = newest('bbchess-v2', 'chess'); if (!s) return 'Open it to load your progress'; const d = (s.days || {})[ymd()] || {};
      const parts = [d.warmDone ? 'warm-up ✓' : 'warm-up', d.opening ? 'opening ✓' : 'opening', d.game ? 'game ✓' : 'game']; return parts.join(' · '); }}
];

/* ---------- Hevy ---------- */
const H = {key: ls.get('practice.hevyKey') || '', goal: ls.get('practice.goal') || 5, rest: ls.get('practice.rest') || [3, 6], // rest days: 0 = Sunday … 3 = Wednesday, 6 = Saturday
  cache: ls.get('practice.hevyCache'), busy:false, err:''};
const localDay = iso => ymd(new Date(iso));
async function hevyFetch(force){
  if (!H.key || H.busy) return;
  if (!force && H.cache && Date.now() - H.cache.at < 5 * 60e3) return;
  H.busy = true; H.err = ''; renderToday();
  try{
    const out = [];
    for (const page of [1, 2]){
      const r = await fetch(`https://api.hevyapp.com/v1/workouts?page=${page}&pageSize=10`, {headers: {'api-key': H.key, 'accept': 'application/json'}});
      if (r.status === 401) throw new Error('key');
      if (r.status === 403) throw new Error('pro');
      if (r.status === 404 && page > 1) break;
      if (!r.ok) throw new Error('http ' + r.status);
      const j = await r.json(); const ws = j.workouts || [];
      ws.forEach(w => out.push({title: w.title || 'Workout', start: w.start_time, end: w.end_time, n: (w.exercises || []).length}));
      if (!ws.length || page >= (j.page_count || 1) || localDay(ws[ws.length - 1].start_time) < ymd(dayAt(-14))) break;
    }
    H.cache = {at: Date.now(), workouts: out}; ls.set('practice.hevyCache', H.cache);
  }catch(e){
    H.err = e.message === 'key' ? 'Hevy didn’t accept that API key. Copy it again from Hevy’s Developer settings.'
      : e.message === 'pro' ? 'Hevy says this account can’t use the API. API access needs Hevy Pro.'
      : e instanceof TypeError ? 'Hevy blocked the request from this site. This needs a small relay set up; tell Claude “Hevy is blocked”.'
      : 'Couldn’t reach Hevy (' + esc(e.message) + '). Try Refresh in a minute.';
  }
  H.busy = false; renderToday();
}
const workoutsOn = off => (H.cache?.workouts || []).filter(w => w.start && localDay(w.start) === ymd(dayAt(off)));
const isRest = off => H.rest.includes(dayAt(off).getDay());
function weekCount(){ const now = dayAt(0), dow = (now.getDay() + 6) % 7; let n = 0; for (let i = 0; i <= dow; i++) if (workoutsOn(-i).length) n++; return n; }

/* ---------- Outfit Inspo (a page inside Claude; it can't be embedded, so it opens in a new tab) ---------- */
const OUTFIT = {url: 'https://claude.ai/artifact/526ztr6SRrbUUpy9ZTgJ9g', at: [6, 0]}; // new picks are ready by 6 AM
const outfitDays = () => { const a = ls.get('practice.outfitDays') || {}, b = (window.Cloud && Cloud.get('outfitDays')) || {}; return Object.assign({}, b, a); };
const outfitSeen = off => !!outfitDays()[ymd(dayAt(off))];
function markOutfit(){ const d = outfitDays(); d[ymd()] = 1; Object.keys(d).sort().slice(0, -60).forEach(k => delete d[k]); ls.set('practice.outfitDays', d); if (window.Cloud && Cloud.user) Cloud.save('outfitDays', d); }
function outfitLine(){
  const now = new Date(), mins = now.getHours() * 60 + now.getMinutes(), drop = OUTFIT.at[0] * 60 + OUTFIT.at[1];
  if (outfitSeen(0)) return `<b>Checked today</b> · new picks every morning by 6 AM`;
  return mins >= drop ? `<b>Today’s picks are in</b> · swipe through pants, shoes, and tops` : `<b>New picks by 6 AM</b> · yesterday’s are still there to swipe`;
}

/* ---------- views ---------- */
const TABS = [{k:'today', label:'Today', color:'--ink'}].concat(APPS.map(a => ({k:a.k, label:a.tab, color:a.color})));
let tab = 'today';
const frames = {};
function show(k){
  if (!TABS.some(t => t.k === k)) k = 'today';
  tab = k;
  $('#today').hidden = k !== 'today';
  APPS.forEach(a => {
    if (a.k === k && !frames[a.k]){
      const f = document.createElement('iframe'); f.src = a.src; f.title = a.name; f.className = a.k; f.allow = 'microphone; autoplay; clipboard-write';
      f.addEventListener('load', () => { f.dataset.loaded = '1'; });
      $('#stage').appendChild(f); frames[a.k] = f;
    }
    if (frames[a.k]) frames[a.k].hidden = a.k !== k;
  });
  if (k === 'today'){ FL.pushed = false; renderToday(); hevyFetch(false); }
  renderNav();
  if (location.hash.slice(1) !== k){ if (k !== 'today' && (location.hash.slice(1) || 'today') === 'today'){ history.pushState(null, '', '#' + k); FL.pushed = true; } else history.replaceState(null, '', '#' + k); }
}
function renderNav(){
  const a = APPS.find(x => x.k === tab), bar = $('#appbar');
  bar.hidden = !a; $('#stage').classList.toggle('inapp', !!a);
  if (a){ bar.className = 'appbar ' + a.k; $('#appname').textContent = a.name; }
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; renderToday(); });
const ui = {open: !H.key ? false : false};
function renderToday(){
  if (tab !== 'today') { renderNav(); return; }
  const date = new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
  const done = APPS.filter(a => a.did(0)).length;
  const wToday = workoutsOn(0), restToday = isRest(0), wDone = wToday.length > 0 || restToday;
  const total = APPS.length + (H.key ? 1 : 0) + 1, got = done + (H.key && wDone ? 1 : 0) + (outfitSeen(0) ? 1 : 0);
  const fit = `<div class="item plum ${outfitSeen(0) ? 'done' : ''}"><div class="ico" aria-hidden="true">${I.hanger}${outfitSeen(0) ? `<span class="ok">${I.check}</span>` : ''}</div>
    <h2>Outfit picks</h2><a class="go" href="${OUTFIT.url}" target="_blank" rel="noopener" data-a="outfit">Open</a>
    <div class="st">${outfitLine()}</div></div>`;
  const firstOpen = APPS.find(a => !a.did(0));
  const rows = APPS.map(a => { const d = a.did(0);
    return `<div class="item ${a.cls} ${d ? 'done' : ''}"><div class="ico" aria-hidden="true">${I[a.k]}${d ? `<span class="ok">${I.check}</span>` : ''}</div>
      <h2>${a.name}</h2><button class="go ${a === firstOpen ? 'lead' : ''}" data-tab="${a.k}">${d ? 'Open' : 'Start'}</button>
      <div class="st"><b>${d ? 'Done today' : 'Not yet'}</b> · ${esc(a.line())}</div></div>`; }).join('');
  let wline;
  if (!H.key) wline = `<b>Not connected</b> · add your Hevy key below`;
  else if (H.err) wline = `<b>Can’t check</b> · see the note below`;
  else if (H.busy && !H.cache) wline = `<b>Checking Hevy…</b>`;
  else if (wToday.length){ const w = wToday[0], min = w.end ? Math.round((new Date(w.end) - new Date(w.start)) / 60000) : null;
    wline = `<b>Logged</b> · ${esc(w.title)}${min ? ` · ${min} min` : ''}${w.n ? ` · ${w.n} exercises` : ''} · ${weekCount()} of ${H.goal} this week`; }
  else if (restToday) wline = `<b>Rest day</b> · ${weekCount()} of ${H.goal} this week`;
  else wline = `<b>No workout logged yet</b> · ${weekCount()} of ${H.goal} this week`;
  const lift = `<div class="item ember ${wDone ? 'done' : ''}"><div class="ico" aria-hidden="true">${I.lift}${wDone ? `<span class="ok">${I.check}</span>` : ''}</div>
    <h2>${restToday && !wToday.length ? 'Rest day' : 'Workout'}</h2><button class="go" data-a="${H.key ? 'hrefresh' : 'hsetup'}">${H.key ? (H.busy ? 'Checking' : 'Refresh') : 'Connect'}</button>
    <div class="st">${wline}</div></div>`;
  const days = Array.from({length:14}, (_, i) => i - 13);
  const grow = (label, color, fn, rest) => `<span class="rl">${label}</span>` + days.map(o => `<i style="--c:var(${color})" class="${fn(o) ? 'on' : rest && rest(o) ? 'rest' : ''} ${o === 0 ? 't' : ''}" title="${rest && rest(o) && !fn(o) ? 'Rest day' : ''}"></i>`).join('');
  const grid = `<span></span>` + days.map(o => `<span class="dl">${o === 0 || o === -7 || o === -13 ? dayAt(o).getDate() : ''}</span>`).join('')
    + APPS.map(a => grow(a.tab, a.color, o => a.did(o))).join('') + (H.key && H.cache ? grow('Workout', '--ember', o => workoutsOn(o).length, isRest) : '') + grow('Outfits', '--plum', outfitSeen);
  const signed = window.Cloud && Cloud.user;
  const hr = new Date().getHours(), greet = hr < 12 ? 'Maayong buntag' : hr < 13 ? 'Maayong udto' : hr < 18 ? 'Maayong hapon' : 'Maayong gabii';
  const R = 40, C = 2 * Math.PI * R, frac = total ? got / total : 0;
  $('#page').innerHTML = `
  <header class="hero"><div><div class="label">${date}</div>
    <h1>${got === total ? 'All done <em>today</em>' : `${greet}, <em>Mikhail</em>`}</h1>
    <p>${got === total ? 'Every practice checked off. Padayon!' : `${total - got} left today.`}</p></div>
    <div class="ring" role="img" aria-label="${got} of ${total} done"><svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="iri" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e98aa6"/><stop offset=".45" stop-color="#e8df7a"/><stop offset=".75" stop-color="#93d99a"/><stop offset="1" stop-color="#34b8a3"/></linearGradient></defs>
      <circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--chip)" stroke-width="9"/>
      <circle class="arc" cx="50" cy="50" r="${R}" fill="none" stroke="url(#iri)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}" ${got ? '' : 'opacity="0"'}/></svg>
      <div class="num"><div><b>${got}<span class="muted" style="font-size:.6em">/${total}</span></b><small>done</small></div></div></div></header>
  <section class="group"><div class="label">Practice</div>${rows}</section>
  <section class="group"><div class="label">Body &amp; style</div>${lift}${fit}</section>
  ${H.err ? `<div class="note bad" role="alert">${H.err}</div>` : ''}
  ${!signed && window.Cloud && Cloud.ready ? `<div class="note signin"><span>Sign in with the same Google account as Padayon so everything syncs between your phone and computers.</span><button class="btn primary" data-a="signin">Sign in</button></div>` : ''}
  <section class="panel"><div class="ptop"><h2>Last 14 days</h2><span class="small muted">Today is outlined${H.key && H.cache ? ' · striped = rest day' : ''}</span></div><div class="grid">${grid}</div></section>
  <section class="panel"><details id="setdet" ${ui.open ? 'open' : ''}><summary>Settings</summary>
    <div class="set"><b>Account</b><span class="small muted">${signed ? `Signed in as ${esc(Cloud.user.email || 'your Google account')}. Padayon, Word Hoard, and chess all sync to this account.` : 'Not signed in. Progress is saved on this device only.'}${window.Cloud && Cloud.err ? ` Last sync error: ${esc(Cloud.err)}` : ''}</span>
      <div><button class="btn" data-a="${signed ? 'signout' : 'signin'}">${signed ? 'Sign out' : 'Sign in with Google'}</button></div></div>
    <div class="set" id="hevyset"><b>Hevy</b><span class="small muted">${H.key ? 'Connected. ' : ''}Needs Hevy Pro. Paste your key from Hevy’s Settings → Developer once; it saves to your account and fills in on every device you sign in on.</span>
      <div class="row"><input class="field" id="hkey" type="password" autocomplete="off" placeholder="Hevy API key" value="${esc(H.key)}" aria-label="Hevy API key"><button class="btn primary" data-a="hsave">Save</button></div>
      ${H.key ? `<div><button class="btn" data-a="hremove">Remove key</button></div>` : ''}
      <span class="small muted">Rest days (count as done on the Today page)</span>
      <div class="seg" role="group" aria-label="Rest days">${[1,2,3,4,5,6,0].map(d => `<button data-a="rest" data-d="${d}" class="${H.rest.includes(d) ? 'on' : ''}" aria-pressed="${H.rest.includes(d)}">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]}</button>`).join('')}</div>
      <span class="small muted">Workouts per week</span>
      <div class="seg">${[3,4,5,6].map(n => `<button data-a="goal" data-n="${n}" class="${H.goal === n ? 'on' : ''}">${n}</button>`).join('')}</div></div>
    <div class="set"><b>Install</b><span class="small muted">${installEvt ? 'Add Daily Practice to this device so it opens like an app.' : 'On iPhone: tap Share, then Add to Home Screen. On Android or PC (Chrome or Edge): use the install icon in the address bar or the browser menu.'}</span>
      ${installEvt ? `<div><button class="btn" data-a="install">Install app</button></div>` : ''}</div>
  </details></section>`;
  renderNav();
}

/* ---------- finishing one app: back to Today, then on to the next ---------- */
const FL = {prev: {}, timer: null, next: null, left: 0};
APPS.forEach(a => FL.prev[a.k] = a.did(0));
const order = a => APPS.indexOf(a);
function nextApp(after){ for (let i = 1; i <= APPS.length; i++){ const a = APPS[(order(after) + i) % APPS.length]; if (!a.did(0)) return a; } return null; }
function stopFlow(){ clearInterval(FL.timer); FL.timer = null; }
function checkFinished(){
  APPS.forEach(a => { FL.prev[a.k] = a.did(0); }); // finishing is signaled by the app itself, not by synced data arriving
}
function finished(a){
  if (FL.cur === a.k && !$('#flow').hidden) return;
  FL.cur = a.k; stopFlow(); FL.left = 6; const nx = nextApp(a);
  const bar = $('#flow');
  const draw = () => { bar.innerHTML = `<div class="msg"><b>${a.name} done.</b> <span class="muted">Back to Today in ${FL.left}${nx ? `, then ${esc(nx.name)}` : ''}.</span></div>
    <button class="btn" data-a="flowstay">Stay here</button><button class="btn primary" data-a="flowgo">Go now</button>`; };
  FL.pending = nx; draw(); bar.hidden = false;
  FL.timer = setInterval(() => { FL.left--; if (FL.left <= 0) backHome(); else draw(); }, 1000);
}
function backHome(){
  stopFlow(); $('#flow').hidden = true; FL.cur = null;
  FL.next = FL.pending || null; FL.pending = null;
  show('today'); $('#today').scrollTop = 0;
  if (FL.next){ FL.left = 3; renderToday(); FL.timer = setInterval(() => { FL.left--; if (FL.left <= 0){ const n = FL.next; FL.next = null; stopFlow(); startApp(n.k); } else renderToday(); }, 1000); }
}
function nextCard(){ const a = FL.next;
  return `<section class="nextup" style="--c:var(${a.color})"><div class="label">Next up</div><h2>${a.name}</h2>
    <span>Opening in ${FL.left}…</span><div class="row"><button class="btn" data-a="nextnow">Open now</button><button class="btn ghost" data-a="nextcancel">Not now</button></div></section>`; }
function startApp(k){
  stopFlow(); FL.next = null; show(k);
  const f = frames[k]; if (!f) return;
  // Opens the app on its own home screen; you start the lesson yourself.
}

/* The Hevy key is kept on this device and in your signed-in account (the same private record as your progress),
   so it only has to be entered once; every device picks it up after you sign in. */
async function setHevyKey(v, announce){
  H.key = v; ls.set('practice.hevyKey', v); H.cache = null;
  if (window.Cloud && Cloud.user) Cloud.save('hevy', {key: v});
  await hevyFetch(true);
  if (announce && !H.err) toast(window.Cloud && Cloud.user ? 'Hevy connected on all your devices' : 'Hevy connected. Sign in to keep it on your other devices.');
}
function syncHevyKey(c){
  if (!c.user || !c.data) return;
  const r = c.get('hevy'), remote = r && typeof r.key === 'string' ? r.key : null;
  if (remote && remote !== H.key){ setHevyKey(remote, false); }
  else if (remote === null && H.key){ Cloud.save('hevy', {key: H.key}); }
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const st = e.target.closest('[data-start]'); if (st){ startApp(st.dataset.start); return; }
  const t = e.target.closest('[data-tab]'); if (t){ show(t.dataset.tab); return; }
  const b = e.target.closest('[data-a]'); if (!b) return;
  switch (b.dataset.a){
    case 'signin': try{ await Cloud.signIn(); }catch(err){ toast(err.message || 'Sign-in failed'); } break;
    case 'signout': await Cloud.signOut(); toast('Signed out. Progress stays on this device.'); break;
    case 'hsetup': ui.open = true; renderToday(); $('#hkey').focus(); $('#hevyset').scrollIntoView({behavior:'smooth', block:'center'}); break;
    case 'hsave': { const v = $('#hkey').value.trim(); if (!v){ toast('Paste your Hevy API key first.'); return; } ui.open = true; await setHevyKey(v, true); break; }
    case 'hremove': H.key = ''; H.cache = null; H.err = ''; try{ localStorage.removeItem('practice.hevyKey'); localStorage.removeItem('practice.hevyCache'); }catch(_){ } if (window.Cloud && Cloud.user) Cloud.save('hevy', {key: ''}); renderToday(); break;
    case 'outfit': markOutfit(); setTimeout(renderToday, 300); break;
    case 'hrefresh': hevyFetch(true); break;
    case 'home': if (FL.pushed){ FL.pushed = false; history.back(); } else show('today'); break;
    case 'flowstay': stopFlow(); FL.pending = null; FL.cur = null; $('#flow').hidden = true; break;
    case 'nextnow': { const n = FL.next; startApp(n.k); break; }
    case 'nextcancel': FL.next = null; stopFlow(); renderToday(); break;
    case 'rest': { const d = +b.dataset.d; H.rest = H.rest.includes(d) ? H.rest.filter(x => x !== d) : H.rest.concat(d); ls.set('practice.rest', H.rest);
      H.goal = Math.min(6, Math.max(3, 7 - H.rest.length)); ls.set('practice.goal', H.goal); renderToday(); break; }
    case 'goal': H.goal = +b.dataset.n; ls.set('practice.goal', H.goal); renderToday(); break;
    case 'install': if (installEvt){ installEvt.prompt(); installEvt = null; renderToday(); } break;
  }
});
document.addEventListener('toggle', e => { if (e.target.id === 'setdet') ui.open = e.target.open; }, true);
window.addEventListener('storage', () => { checkFinished(); renderToday(); });
// Each app sends this when you finish its daily session, even if it was already done earlier today.
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.practice !== 'done') return;
  const a = APPS.find(x => x.k === e.data.app); if (!a || tab !== a.k) return;
  FL.prev[a.k] = true; renderToday();
});
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
document.addEventListener('visibilitychange', () => { if (!document.hidden && tab === 'today'){ renderToday(); hevyFetch(false); } });
if (window.Cloud) Cloud.on(c => { syncHevyKey(c); checkFinished(); renderToday(); });
// Pasting a key saves it right away, no Save tap needed
document.addEventListener('input', e => { if (e.target.id === 'hkey'){ const v = e.target.value.trim(); if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v) && v !== H.key){ ui.open = true; setHevyKey(v, true); } } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
show(location.hash.slice(1) || 'today');
</script>
