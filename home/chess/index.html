<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style>html{background:var(--bg);overscroll-behavior:none}body{overscroll-behavior:none}html.embed:root{padding-bottom:0!important;padding-top:0!important}html.embed{scroll-padding-top:0!important}html.embed body::before{display:none!important}html.embed .bar{top:0!important}html.embed .rail{top:76px!important}html.embed .coach{top:0!important}</style></head><body>
<title>Brick by Brick Chess</title>
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: top tab bar (Today · Learn · Openings · Puzzles · Play · Progress); each view is a reading column beside a board panel */
:root{
  --bg:#f1f2ed; --surface:#ffffff; --surface-2:#e7e9e1; --fg:#161d17; --muted:#5d685f; --line:#d8dcd2;
  --accent:#4a7a3d; --accent-ink:#ffffff; --accent-soft:#e3eddc;
  --brick:#b4583c; --brick-soft:#f2ddd4;
  --good:#3d8a4f; --good-soft:#e1f1e4; --bad:#c0432f; --bad-soft:#f8e2dc; --warn:#b98318; --warn-soft:#f6ecd2;
  --sq-light:#ebecd0; --sq-dark:#779556; --sq-mark:rgba(246,222,90,.62); --sq-sel:rgba(94,151,228,.55); --sq-bad:rgba(214,72,52,.55); --sq-good:rgba(70,160,90,.6); --dotc:rgba(20,30,20,.28);
  --shadow:0 1px 2px rgba(22,29,23,.06),0 8px 28px rgba(22,29,23,.08);
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1410; --surface:#171e18; --surface-2:#202a21; --fg:#e7ece5; --muted:#99a69b; --line:#2a352c;
  --accent:#8fc27c; --accent-ink:#0f1410; --accent-soft:#1f2e1c; --brick:#e08566; --brick-soft:#3a231b;
  --good:#7fcd92; --good-soft:#183021; --bad:#f08b78; --bad-soft:#3b1f1a; --warn:#e0b450; --warn-soft:#33290f;
  --sq-light:#d9dbbd; --sq-dark:#6a874b; --dotc:rgba(10,15,10,.35);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1410; --surface:#171e18; --surface-2:#202a21; --fg:#e7ece5; --muted:#99a69b; --line:#2a352c;
  --accent:#8fc27c; --accent-ink:#0f1410; --accent-soft:#1f2e1c; --brick:#e08566; --brick-soft:#3a231b;
  --good:#7fcd92; --good-soft:#183021; --bad:#f08b78; --bad-soft:#3b1f1a; --warn:#e0b450; --warn-soft:#33290f;
  --sq-light:#d9dbbd; --sq-dark:#6a874b; --dotc:rgba(10,15,10,.35);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;white-space:nowrap}
.logo em{font-style:normal;color:var(--brick)}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tab{all:unset;cursor:pointer;padding:8px 13px;border-radius:9px;font-weight:700;font-size:14.5px;white-space:nowrap;color:var(--muted)}
.tab:hover{color:var(--fg);background:var(--surface-2)}
.tab.on{color:var(--fg);background:var(--accent-soft)}
.tab:focus-visible{outline:2px solid var(--accent)}
.streak{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:13px;white-space:nowrap;padding:5px 10px;border-radius:20px;background:var(--brick-soft);color:var(--fg)}
.streak b{color:var(--brick);font-size:15px}
.sync{font-size:11px;color:var(--muted);white-space:nowrap}

/* Generic */
.vhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;margin-bottom:22px}
.vhead h1{font-size:clamp(30px,4.6vw,48px);font-weight:800;letter-spacing:-.025em;margin-top:6px}
.vhead p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:19px;font-weight:700}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,480px);gap:32px;align-items:start}
.btn{all:unset;box-sizing:border-box;cursor:pointer;font-size:14px;font-weight:700;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.warn{background:var(--brick);border-color:var(--brick);color:#fff}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;padding:3px 8px;border-radius:20px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
select,input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0;max-width:100%}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;min-width:0}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}

/* Board */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.sticky{align-self:start}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.side{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.side i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--fg)}
.side i.w{background:#fff}.side i.b{background:#222}
.prompt{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.3;margin:0}
.board{position:relative;width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.squares{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.sq{all:unset;position:relative;cursor:pointer}
.sq.l{background:var(--sq-light)}.sq.d{background:var(--sq-dark)}
.sq::before{content:"";position:absolute;inset:0;pointer-events:none}
.sq.last::before{background:var(--sq-mark);opacity:.7}
.sq.mark::before{background:var(--sq-mark);opacity:1}
.sq.sel::before{background:var(--sq-sel)}
.sq.bad::before{background:var(--sq-bad)}
.sq.good::before{background:var(--sq-good)}
.sq.check::before{background:radial-gradient(circle,rgba(220,40,30,.85) 0,rgba(220,40,30,.4) 45%,transparent 72%)}
.sq.tgt::after{content:"";position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%;background:var(--dotc)}
.sq.tgt.cap::after{width:92%;height:92%;background:transparent;border:5px solid var(--dotc)}
.sq:focus-visible{outline:3px solid #2f6fd6;outline-offset:-3px;z-index:2}
.sq .cf,.sq .cr{position:absolute;font-family:var(--f-mono);font-size:10px;font-weight:500;z-index:1;pointer-events:none}
.sq .cf{right:4px;bottom:2px}.sq .cr{left:4px;top:2px}
.sq.l .cf,.sq.l .cr{color:var(--sq-dark)}.sq.d .cf,.sq.d .cr{color:var(--sq-light)}
.pieces{position:absolute;inset:0;pointer-events:none}
.piece{position:absolute;left:0;top:0;width:12.5%;height:12.5%;will-change:transform}
.piece svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.piece.gone{opacity:0}
@media (prefers-reduced-motion:no-preference){
  .piece{transition:transform .22s cubic-bezier(.3,.7,.3,1),opacity .2s}
  .board.shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
}
.fb{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--surface-2);font-size:15px;line-height:1.45;min-height:56px}
.fb .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--surface);color:var(--muted)}
.fb.ok{background:var(--good-soft);border-color:var(--good)}.fb.ok .ic{background:var(--good);color:var(--accent-ink)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}.fb.no .ic{background:var(--bad);color:#fff}
.fb.go{background:var(--accent-soft);border-color:var(--accent)}.fb.go .ic{background:var(--accent);color:var(--accent-ink)}
.fb.warn{background:var(--warn-soft);border-color:var(--warn)}.fb.warn .ic{background:var(--warn);color:#fff}
.fb b{font-family:var(--f-display);font-size:16px;display:block}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .grow{margin-left:auto}
.pdots{display:flex;gap:6px;flex-wrap:wrap}
.pdot{all:unset;cursor:pointer;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;border:1.5px solid var(--line)}
.pdot.on{border-color:var(--fg)}
.pdot.solved{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.pdot.failed{background:var(--bad-soft);border-color:var(--bad)}
.pdot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thinking{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-height:18px}

/* Learn */
.learn{display:grid;grid-template-columns:270px minmax(0,1fr);gap:32px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);max-height:calc(100vh - 96px);overflow:auto}
.rail-prog{padding:4px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.unit-h{padding:10px 8px 4px}
.lbtn{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;font-size:14.5px;line-height:1.3;width:100%}
.lbtn:hover{background:var(--surface-2)}
.lbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lbtn .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;border:1.5px solid var(--line);color:var(--muted);background:var(--surface)}
.lbtn.on{background:var(--accent-soft);font-weight:700}
.lbtn.on .n{border-color:var(--accent);color:var(--accent)}
.lbtn.done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lbtn.done .n::before{content:"✓";font-size:13px}.lbtn.done .n span{display:none}
.lhead{margin-bottom:20px}
.lhead h2{font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.02em;margin-top:8px}
.reading{min-width:0;max-width:62ch}
.key{font-family:var(--f-display);font-size:clamp(20px,2.3vw,24px);font-weight:500;line-height:1.3;margin:0 0 20px;padding-left:16px;border-left:4px solid var(--brick);text-wrap:pretty}
.reading p{margin:0 0 14px}
.reading ul{margin:0 0 16px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.reading ul li{position:relative;padding-left:22px}
.reading ul li::before{content:"";position:absolute;left:4px;top:.62em;width:8px;height:8px;border-radius:2px;background:var(--brick)}
ol.steps{margin:0 0 16px;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;position:relative;padding-left:38px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--brick-soft);color:var(--brick);font-family:var(--f-mono);font-size:12px;display:grid;place-items:center;font-weight:700}
.values{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:4px 0 18px}
.val{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 4px 8px;text-align:center}
.val svg{width:44px;height:44px;display:block;margin:0 auto}
.val b{display:block;font-family:var(--f-display);font-size:22px;line-height:1}
.val small{font-size:12px;color:var(--muted)}
.mine{background:var(--brick-soft);border-radius:12px;padding:14px 16px;margin:18px 0}
.mine .eyebrow{color:var(--brick);display:block;margin-bottom:4px}
.mine p{margin:0}.mine a{font-weight:700}
.more{border:1px dashed var(--line);border-radius:12px;padding:12px 16px;margin:18px 0}
.more ul{margin:6px 0 0!important;gap:4px!important}
.more a{color:var(--accent);font-weight:700}
.hw{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:24px}
.hw .ico{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center}
.hw .ico svg{width:30px;height:30px}
.hw p{margin:2px 0 0}
.checks{display:flex;flex-direction:column}
.check{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.lnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:32px;padding-top:18px;border-top:1px solid var(--line)}

/* Today */
.today{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,480px);gap:28px;align-items:start}
.plan{display:flex;flex-direction:column;gap:14px}
.task{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center}
.task .num{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display);font-weight:800;font-size:18px}
.task.done .num{background:var(--good);color:var(--accent-ink)}
.task.done .num::before{content:"✓"}.task.done .num span{display:none}
.task h3{font-size:17px}
.task p{margin:2px 0 0;font-size:14.5px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin-top:10px}
.cal i{aspect-ratio:1;border-radius:4px;background:var(--surface-2);display:block}
.cal i.on{background:var(--brick)}.cal i.part{background:var(--brick-soft);box-shadow:inset 0 0 0 1.5px var(--brick)}.cal i.today{outline:2px solid var(--fg);outline-offset:1px}
.focus{border-left:4px solid var(--brick)}

/* Openings */
.olist{display:flex;flex-direction:column;gap:18px}
.ogroup{display:flex;flex-direction:column;gap:6px}
.oitem{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.oitem:hover{border-color:var(--fg)}
.oitem.on{border-color:var(--accent);background:var(--accent-soft)}
.oitem:focus-visible{outline:2px solid var(--accent)}
.oitem b{display:block;font-size:14.5px;line-height:1.3}
.oitem small{color:var(--muted);font-size:12.5px}
.moves{font-family:var(--f-mono);font-size:13px;line-height:1.9;display:flex;flex-wrap:wrap;gap:2px 6px;min-height:24px}
.moves span.m{padding:0 4px;border-radius:4px}
.moves span.m.cur{background:var(--accent-soft);color:var(--accent);font-weight:700}
.moves span.n{color:var(--muted)}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:15px;min-height:46px}
.note b{font-family:var(--f-mono);font-size:13px;margin-right:6px}
.boxes{display:inline-flex;gap:3px}
.boxes i{width:8px;height:8px;border-radius:2px;background:var(--surface-2)}
.boxes i.on{background:var(--accent)}

/* Play / review */
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
.movelist{max-height:220px;overflow:auto;font-family:var(--f-mono);font-size:13px;display:grid;grid-template-columns:34px 1fr 1fr;gap:2px 8px;align-content:start}
.movelist .no{color:var(--muted)}
.mat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-family:var(--f-mono);min-height:18px}
.moments{display:flex;flex-direction:column;gap:8px}
.moment{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.moment:hover,.moment.on{border-color:var(--fg)}
.moment:focus-visible{outline:2px solid var(--accent)}
.moment p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.overlay{position:absolute;inset:0;background:rgba(15,20,16,.55);display:grid;place-items:center;z-index:4;padding:16px}
.overlay .card{max-width:320px;text-align:left}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.bricks{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.brk{height:22px;border-radius:3px;background:var(--surface-2)}
