<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Padayon Bisaya</title>
<meta name="theme-color" content="#0B6B66">
<meta name="description" content="Daily Bisaya (Cebuano) practice with an AI speaking tutor.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one phone-width column; home is a stack of panels, a session takes the whole column with a sticky check bar. */
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --ink:#12211D; --muted:#566963; --line:#D0DCD8; --chip:#E1EAE7;
  --sea:#0B6B66; --sea-ink:#FFFFFF; --sea-soft:#D3E9E6;
  --mango:#D9921A; --mango-soft:#FBEBCB;
  --good:#1F7D49; --good-bg:#DCF0E3; --bad:#B8354A; --bad-bg:#F8DEE2;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1614; --surface:#14211E; --ink:#E4EEEB; --muted:#93A8A2; --line:#263833; --chip:#1B2C28;
  --sea:#43B9AF; --sea-ink:#04201C; --sea-soft:#163834;
  --mango:#F0B547; --mango-soft:#3A2C10;
  --good:#52CB87; --good-bg:#11301F; --bad:#F27B8E; --bad-bg:#3B1820; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1614; --surface:#14211E; --ink:#E4EEEB; --muted:#93A8A2; --line:#263833; --chip:#1B2C28;
  --sea:#43B9AF; --sea-ink:#04201C; --sea-soft:#163834;
  --mango:#F0B547; --mango-soft:#3A2C10;
  --good:#52CB87; --good-bg:#11301F; --bad:#F27B8E; --bad-bg:#3B1820; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.15rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--chip);min-height:46px}
.btn.primary{background:var(--sea);color:var(--sea-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--sea) 60%,#000)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--sea) 60%,#000)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:1.7rem;font-weight:800;color:var(--sea)}
.stats{display:flex;gap:8px}
.stat{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700}
.stat svg{width:18px;height:18px}
.flame{color:var(--mango)}

/* hero */
.hero{background:var(--sea);color:var(--sea-ink);border-radius:18px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:140px;opacity:.13;
  background:repeating-linear-gradient(45deg,currentColor 0 6px,transparent 6px 14px),repeating-linear-gradient(-45deg,currentColor 0 6px,transparent 6px 14px);border-radius:50%}
.hero h2{font-size:1.5rem;font-weight:800}
.hero p{margin:4px 0 0;opacity:.9}
.hero .btn{background:var(--sea-ink);color:var(--sea);box-shadow:none;position:relative;z-index:1}
.ring{width:84px;height:84px;position:relative;z-index:1}
.ringwrap{position:relative;width:84px;height:84px;z-index:1}.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-family:var(--f-display);font-size:1.15rem;line-height:1.05}.ringtxt small{font-weight:500;font-size:.66rem;opacity:.85}
[hidden]{display:none!important}
.hero-actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}

/* checklist */
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:transparent;padding:0}
.box.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.box svg{width:16px;height:16px}
.check b{display:block}

/* drills */
.drills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.drill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:112px}
.drill:hover{border-color:var(--sea)}
.drill .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800;color:var(--sea);line-height:1.1}
.drill b{font-size:1rem}

/* units */
.unit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.unit:first-child{border-top:0}
.unit .nm{min-width:0}
.unit .nm b{font-family:var(--f-display)}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.unit.focus .nm b{color:var(--sea)}
.pill{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sea-soft);color:var(--sea)}
details summary{cursor:pointer;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 12px;font-weight:700}
.seg button.on{background:var(--sea);color:var(--sea-ink);border-color:var(--sea)}

/* session */
.sbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.x{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.x svg{width:22px;height:22px}
.prog{flex:1;height:14px;border-radius:99px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.speedchip{font-weight:800;color:var(--sea);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex{display:flex;flex-direction:column;gap:18px;min-height:52vh;padding-top:8px}
.ex h2{font-size:1.35rem}
.prompt{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.25}
.ceb{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.15;color:var(--sea);overflow-wrap:anywhere}
.playrow{display:flex;gap:12px;align-items:center}
.play{width:84px;height:84px;border-radius:22px;border:0;background:var(--sea);color:var(--sea-ink);display:grid;place-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--sea) 55%,#000);flex:none}
.play svg{width:40px;height:40px}
.play.sm{width:56px;height:56px;border-radius:16px}
.play.sm svg{width:26px;height:26px}
.play.slow{background:var(--chip);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.play.playing{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.95)}}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:14px;padding:14px 16px;text-align:left;font-size:1.05rem;min-height:56px}
.opt.sel{border-color:var(--sea);background:var(--sea-soft)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.cebopt{font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.tray{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px 14px;font-size:1.1rem;font-weight:700}
.tile.used{visibility:hidden}
.field{width:100%;font:inherit;font-size:1.2rem;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
textarea.field{min-height:96px;resize:vertical}
.timer{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.timer i{display:block;height:100%;background:var(--mango);width:100%}
.grades{display:grid;gap:8px}
.grades .btn{text-align:left}
.stage{display:flex;gap:6px}
.stage span{flex:1;padding:8px;border-radius:10px;background:var(--chip);text-align:center;font-weight:700;font-size:.85rem;color:var(--muted)}
.stage span.on{background:var(--mango-soft);color:var(--ink);outline:2px solid var(--mango)}
.stage span.done{background:var(--good-bg);color:var(--good)}
.foot{position:sticky;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));border-radius:16px 16px 0 0;background:var(--bg);border-top:2px solid var(--line);display:flex;flex-direction:column;gap:10px;z-index:4}
.foot.good{background:var(--good-bg);border-color:var(--good)}
.foot.bad{background:var(--bad-bg);border-color:var(--bad)}
.verdict{font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.foot.good .verdict{color:var(--good)}
.foot.bad .verdict{color:var(--bad)}
.foot .ans{font-weight:700}
.foot.good .btn.primary{background:var(--good);box-shadow:0 3px 0 color-mix(in srgb,var(--good) 55%,#000)}
.foot.bad .btn.primary{background:var(--bad);box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 55%,#000)}
.summary{text-align:center;align-items:center}
.sumgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.sumgrid div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 6px}
.sumgrid b{display:block;font-family:var(--f-display);font-size:1.6rem;color:var(--sea)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;overflow-wrap:anywhere}
.msg.them{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--sea);color:var(--sea-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg .tr{font-size:.86rem;color:var(--muted);margin-top:6px}
.fix{align-self:flex-end;max-width:88%;font-size:.88rem;background:var(--mango-soft);border-radius:12px;padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--sea);font-weight:700;font-size:.86rem;text-decoration:underline}
.gap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.gap:first-child{border-top:0}
.gap .c{font-family:var(--f-display);font-weight:700;color:var(--sea)}
.note{background:var(--mango-soft);border-color:transparent;font-size:.95rem}
.grade .score{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;min-width:64px}
.corr{font-family:var(--f-display);font-weight:700;font-size:1.2rem;color:var(--sea)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;max-width:calc(100% - 32px)}
.wbw{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.wb{display:flex;flex-direction:column;align-items:flex-start;background:var(--chip);border-radius:10px;padding:6px 10px;min-width:0;max-width:100%}
.wb b{font-family:var(--f-display);color:var(--sea)}
.wb i{font-style:normal;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.tip{background:var(--sea-soft);border-color:transparent;gap:6px}
.msg .miniplay{padding:4px 10px}
.loadnote{font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.ceb{font-size:1.7rem}.prompt{font-size:1.4rem}.ringwrap,.ring{width:68px;height:68px}.hero h2{font-size:1.3rem}}

html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--sea);color:var(--sea-ink);display:grid;place-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--sea) 55%,#000);flex:none;position:relative}
.mic svg{width:42px;height:42px}
.mic.rec{background:var(--bad);box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 50%,transparent);animation:ring 1.2s ease-out infinite}
.mic.busy{opacity:.6;cursor:wait}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
.microw{display:flex;align-items:center;gap:16px}
.lvl{flex:1;height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.lvl i{display:block;height:100%;width:0;background:var(--bad);transition:width .08s}
.heard{font-size:.95rem;background:var(--chip);border-radius:12px;padding:10px 12px}
.heard b{font-weight:700}
.miniplay{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.88rem;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.miniplay svg{width:16px;height:16px}
.notes{margin:0;padding-left:18px}
.notes li{margin:2px 0}
.keybox{display:flex;gap:8px;flex-wrap:wrap}
.keybox .field{flex:1;min-width:0;font-size:1rem;padding:10px 12px}
.weak{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.weak:first-child{border-top:0}
.weak .n{font-family:var(--f-display);font-weight:800;color:var(--bad);min-width:28px}
.banner{background:var(--mango-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="filein" hidden>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="learn.js"></script>
<script src="app.js"></script>
</body>
</html>
