<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Padayon Bisaya</title>
<meta name="theme-color" content="#0f1719">
<meta name="description" content="Daily Bisaya (Cebuano) practice with Binko and the Lucky Clovers.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script>try{if(window.parent!==window)document.documentElement.classList.add('embed')}catch(e){document.documentElement.classList.add('embed')}</script>
<style>
/* Layout: one phone-width column; home is a stack of panels, a session takes the whole column with a sticky check bar. */
:root{--bg:#0f1719;--surface:#172427;--ink:#f3f1e4;--muted:#a6bcb4;--line:#2a4245;--chip:#1f3236;--sea:#34b8a3;--sea-ink:#0a1f1c;--sea-soft:#173d39;--mango:#e8df7a;--mango-soft:#2c301f;--good:#93d99a;--good-bg:#15301e;--bad:#ef8fa5;--bad-bg:#371c26;--pink:#e98aa6;--copper:#d0875a;--sky:#7cc3ea;--iri:linear-gradient(115deg,#e98aa6 0%,#e8df7a 45%,#93d99a 75%,#34b8a3 100%);--f-display:"Fredoka", "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;--f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;--r:16px;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.15rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--chip);min-height:46px}
.btn.primary{background:var(--sea);color:var(--sea-ink)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--sea) 60%,#000)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:1.7rem}
.stats{display:flex;gap:8px}
.stat{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700}
.stat svg{width:18px;height:18px}
.flame{color:var(--mango)}

/* hero */
.hero{border-radius:18px;padding:20px;display:grid;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:140px;opacity:.13;background:repeating-linear-gradient(45deg,currentColor 0 6px,transparent 6px 14px),repeating-linear-gradient(-45deg,currentColor 0 6px,transparent 6px 14px);border-radius:50%}
.hero h2{font-size:1.5rem;font-weight:800}
.hero p{margin:4px 0 0;opacity:.9}
.hero .btn{position:relative;z-index:1}
.ring{width:84px;height:84px;position:relative;z-index:1}
.ringwrap{position:relative;width:84px;height:84px;z-index:1}.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-family:var(--f-display);font-size:1.15rem;line-height:1.05}.ringtxt small{font-weight:500;font-size:.66rem;opacity:.85}
[hidden]{display:none!important}
.hero-actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}

/* checklist */
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:transparent;padding:0}
.box.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.box svg{width:16px;height:16px}
.check b{display:block}

/* drills */
.drills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.drill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:112px}
.drill .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800;line-height:1.1}
.drill b{font-size:1rem}

/* units */
.unit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.unit:first-child{border-top:0}
.unit .nm{min-width:0}
.unit .nm b{font-family:var(--f-display)}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.unit.focus .nm b{color:var(--sea)}
.pill{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sea-soft);color:var(--sea)}
details summary{cursor:pointer;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 12px;font-weight:700}
.seg button.on{background:var(--sea);color:var(--sea-ink);border-color:var(--sea)}

/* session */
.sbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.x{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.x svg{width:22px;height:22px}
.prog{flex:1;height:14px;border-radius:99px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.speedchip{font-weight:800;color:var(--sea);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex{display:flex;flex-direction:column;gap:18px;min-height:52vh;padding-top:8px}
.ex h2{font-size:1.35rem}
.prompt{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.25}
.ceb{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.15;color:var(--sea);overflow-wrap:anywhere}
.playrow{display:flex;gap:12px;align-items:center}
.play{width:84px;height:84px;border-radius:22px;border:0;background:var(--sea);color:var(--sea-ink);display:grid;place-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--sea) 55%,#000);flex:none}
.play svg{width:40px;height:40px}
.play.sm{width:56px;height:56px;border-radius:16px}
.play.sm svg{width:26px;height:26px}
.play.slow{background:var(--chip);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.play.playing{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.95)}}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:14px;padding:14px 16px;text-align:left;font-size:1.05rem;min-height:56px}
.opt.sel{border-color:var(--sea)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.tile.right{border-color:var(--good);background:var(--good-bg)}
.tile.wrong{border-color:var(--bad);background:var(--bad-bg)}
.tile.sel{border-color:var(--sea);background:var(--sea-soft)}
.opt.cebopt{font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.tray{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px 14px;font-size:1.1rem;font-weight:700}
.tile.used{visibility:hidden}
.field{width:100%;font:inherit;font-size:1.2rem;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
textarea.field{min-height:96px}
.timer{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.timer i{display:block;height:100%;background:var(--mango);width:100%}
.grades{display:grid;gap:8px}
.grades .btn{text-align:left}
.stage{display:flex;gap:6px}
.stage span{flex:1;padding:8px;border-radius:10px;background:var(--chip);text-align:center;font-weight:700;font-size:.85rem;color:var(--muted)}
.stage span.on{background:var(--mango-soft);color:var(--ink);outline:2px solid var(--mango)}
.stage span.done{background:var(--good-bg);color:var(--good)}
.foot{position:sticky;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));border-radius:16px 16px 0 0;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:10px;z-index:4}
.foot.good{background:var(--good-bg);border-color:var(--good)}
.foot.bad{background:var(--bad-bg);border-color:var(--bad)}
.verdict{font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.foot.good .verdict{color:var(--good)}
.foot.bad .verdict{color:var(--bad)}
.foot .ans{font-weight:700}
.foot.good .btn.primary{background:var(--good);box-shadow:0 3px 0 color-mix(in srgb,var(--good) 55%,#000)}
.foot.bad .btn.primary{background:var(--bad);box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 55%,#000)}
.summary{text-align:center;align-items:center}
.sumgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.sumgrid div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 6px}
.sumgrid b{display:block;font-family:var(--f-display);font-size:1.6rem;color:var(--sea)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;overflow-wrap:anywhere}
.msg.them{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;border-bottom-right-radius:4px}
.msg .tr{font-size:.86rem;color:var(--muted);margin-top:6px}
.fix{align-self:flex-end;max-width:88%;font-size:.88rem;background:var(--mango-soft);border-radius:12px;padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--sea);font-weight:700;font-size:.86rem;text-decoration:underline}
.gap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.gap:first-child{border-top:0}
.gap .c{font-family:var(--f-display);font-weight:700;color:var(--sea)}
.note{font-size:.95rem}
.grade .score{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;min-width:64px}
.corr{font-family:var(--f-display);font-weight:700;font-size:1.2rem;color:var(--sea)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;max-width:calc(100% - 32px)}
.wbw{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.wb{display:flex;flex-direction:column;align-items:flex-start;border-radius:10px;padding:6px 10px;min-width:0;max-width:100%}
.wb b{font-family:var(--f-display);color:var(--sea)}
.wb i{font-style:normal;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.tip{gap:6px}
.msg .miniplay{padding:4px 10px}
.loadnote{font-size:.82rem;color:var(--muted)}

/* Binko comes alive: idle on the home screen, reactions in lessons */
.guide .art.face{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #2a9e8c;flex:none;align-self:flex-end}
.guide.big .art.face{width:84px;height:84px}
.guide .art.face{animation:none!important}
.guide .art:not(.idle){transform-origin:50% 100%}.hero-guide .guide .art:not(.idle){animation:bk-idle 3.6s ease-in-out infinite}
@keyframes bk-idle{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-4px) rotate(-2deg)}40%{transform:translateY(0) rotate(0)}55%{transform:translateY(-2px) rotate(3deg)}62%{transform:translateY(-2px) rotate(-3deg)}70%{transform:translateY(-2px) rotate(3deg)}80%{transform:translateY(0) rotate(0)}}
.hero-guide .guide{position:relative}
.hero-guide .guide::before{content:'✦';position:absolute;left:96px;top:-4px;color:#f0e278;font-size:14px;animation:bk-twinkle 2.4s ease-in-out infinite}
@keyframes bk-twinkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
.since{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.9rem;opacity:.92;margin-top:4px}
.since b{font-family:var(--f-display)}
.bx{position:relative;width:64px;height:64px;flex:none}
.bx img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#173d39;border:3px solid #2a9e8c}
.bx.right img{animation:bk-hop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes bk-hop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-14px) scale(1.08) rotate(-6deg)}70%{transform:translateY(0) scale(.96,1.04)}100%{transform:none}}
.bx.right::after{content:'✦ ✧ ✦';position:absolute;left:-6px;right:-6px;top:-10px;text-align:center;color:#f0e278;font-size:13px;letter-spacing:4px;animation:bk-spark .9s ease-out forwards}
@keyframes bk-spark{0%{opacity:0;transform:translateY(8px) scale(.6)}40%{opacity:1}100%{opacity:0;transform:translateY(-12px) scale(1.2)}}
.bx.wrong img{border-color:#c46b4f;filter:saturate(.7);animation:bk-wobble .8s ease-in-out}
@keyframes bk-wobble{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-8deg)}40%{transform:translateX(5px) rotate(6deg)}60%{transform:translateX(-3px) rotate(-4deg)}80%{transform:translateX(2px) rotate(2deg)}}
.bx.wrong::after{content:'💧';position:absolute;right:-2px;top:2px;font-size:15px;animation:bk-drop 1.2s ease-in forwards}
@keyframes bk-drop{0%{opacity:0;transform:translateY(-4px)}30%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
.bx.streak img{border-color:#f2a7c3;animation:bk-spin 1s cubic-bezier(.4,1.5,.5,1)}
@keyframes bk-spin{0%{transform:scale(1) rotate(0)}50%{transform:scale(1.15) rotate(200deg)}100%{transform:scale(1) rotate(360deg)}}
.bx .run{position:absolute;bottom:-6px;right:-8px;background:#e8743b;color:#fff;font-weight:800;font-size:.75rem;border-radius:10px;padding:1px 6px;animation:bk-pop .5s .4s both cubic-bezier(.3,1.8,.5,1)}
@keyframes bk-pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.ceb{font-size:1.7rem}.prompt{font-size:1.4rem}.ringwrap,.ring{width:68px;height:68px}.hero h2{font-size:1.3rem}}

html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--sea);color:var(--sea-ink);display:grid;place-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--sea) 55%,#000);flex:none;position:relative}
.mic svg{width:42px;height:42px}
.mic.rec{background:var(--bad);box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 50%,transparent);animation:ring 1.2s ease-out infinite}
.mic.busy{opacity:.6;cursor:wait}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
.microw{display:flex;align-items:center;gap:16px}
.lvl{flex:1;height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.lvl i{display:block;height:100%;width:0;background:var(--bad);transition:width .08s}
.heard{font-size:.95rem;background:var(--chip);border-radius:12px;padding:10px 12px}
.heard b{font-weight:700}
.miniplay{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.88rem;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.miniplay svg{width:16px;height:16px}
.notes{margin:0;padding-left:18px}
.notes li{margin:2px 0}
.keybox{display:flex;gap:8px;flex-wrap:wrap}
.keybox .field{flex:1;min-width:0;font-size:1rem;padding:10px 12px}
.weak{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.weak:first-child{border-top:0}
.weak .n{font-family:var(--f-display);font-weight:800;color:var(--bad);min-width:28px}
.banner{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}

/* ---------- Rhine x Binko ---------- */
body{background:radial-gradient(120% 55% at 50% -8%,rgba(232,223,122,.16),transparent 62%),linear-gradient(rgba(15,23,25,.84),rgba(15,23,25,.95)),url(img/darkness.webp) center top/cover fixed,#0f1719}
.panel,.drill,.sumgrid div{border:2px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.brand h1{background:var(--iri);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.stat{border:2px solid var(--line)}
.hero{background:linear-gradient(160deg,#1e5550,#163c38 70%);color:var(--ink);border:2px solid #2c6a62;box-shadow:0 4px 0 rgba(0,0,0,.4);grid-template-columns:1fr auto}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--iri)}
.hero::after{display:none}
.hero .btn{background:var(--iri);color:#1a1a12;font-weight:700;box-shadow:0 3px 0 #9a5a3a}
.hero-guide{grid-column:1/-1}
.ringwrap{color:var(--mango)}
.prog i,.bar i{background:var(--iri)}
.btn.primary{box-shadow:0 3px 0 #1d6b60}
.drill .big{color:var(--sea)}
.drill:hover{border-color:var(--sea)}
.note{background:#2b2f1d;border-color:#4a4c2a;position:relative;padding-right:84px}
.note .peek{position:absolute;right:6px;bottom:4px;width:70px;height:auto}
.tip{background:#1a3532;border-color:#2c5a54}
.wb{background:var(--chip);border:1px solid var(--line)}
.opt,.tile{border-color:var(--line);background:var(--surface)}
.opt.sel{background:var(--sea-soft)}
.msg.me{background:linear-gradient(140deg,#2a9e8c,#34b8a3);color:#0a1f1c}
.banner{background:#2c301f;border:2px solid #4a4c2a}
.rulechip{background:#1e2b3a;border-color:#33506b;gap:4px}
.rulechip b{color:#8fd0f5}
details.rule summary{cursor:pointer;list-style:none}
details.rule summary::-webkit-details-marker{display:none}
details.rule[open]{border-color:var(--sea)}
details.rule.later{opacity:.72}
.phon{font-size:.85rem;color:var(--muted);letter-spacing:.02em;margin:2px 0 4px}
.phon span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.gap .phon{grid-column:1/-1;margin:0}
.btabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.btab{border:1px solid var(--line);background:var(--surface);color:inherit;border-radius:999px;padding:5px 11px;font:inherit;font-size:.85rem;white-space:nowrap;cursor:pointer}
.btab.on{background:var(--sea);color:#0a1f1c;border-color:var(--sea);font-weight:700}
.blist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.blist li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px}
.blist li.me{background:var(--sea-soft)}
.blist .rk{text-align:center}
.vid{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.good-note{background:#1a3532;border-color:#2c5a54}
.twitter-tweet{margin:0 auto!important;max-width:100%!important}
blockquote.twitter-tweet{border-left:3px solid var(--sea);padding:8px 12px;background:var(--surface);border-radius:10px}
textarea.field{resize:vertical;font:inherit}

.art{display:block;object-fit:cover}
.art.framed{border-radius:12px;border:2px solid var(--line);object-position:50% 15%}
.art.cut{object-fit:contain;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.guide{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:end}
.guide .art{width:72px;height:76px;object-position:50% 50%}
.guide.big .art{width:96px;height:100px}
.bubble{position:relative;background:#f3f1e4;color:#1d2422;border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:.95rem;line-height:1.35;border:2px solid #1d2422;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.bubble .who{display:block;font-family:var(--f-display);font-weight:700;font-size:.78rem;letter-spacing:.04em;color:#1f7d6f;margin-bottom:2px}
.cameo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;background:rgba(0,0,0,.18);border-radius:12px;padding:8px;animation:pop .35s ease-out}
.cameo .face{width:72px;height:72px;border-radius:14px;object-fit:cover;object-position:50% 30%;border:2px solid var(--line);background:#1f3236;display:block}
.cameo .who{font-family:var(--f-display);font-weight:700;font-size:.82rem;color:var(--mango)}
.cameo .line{font-size:.92rem}
.summary .cameo,.summary .guide{text-align:left;width:100%}
@keyframes pop{0%{transform:translateY(6px);opacity:0}100%{transform:none;opacity:1}}
.foot{background:var(--bg)}
.stage-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.stage-row:first-child{border-top:0}
.stage-dot{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--chip);color:var(--muted);border:2px solid var(--line)}
.stage-dot svg{width:16px;height:16px}
.stage-row.done .stage-dot{background:var(--good);color:#0a1f1c;border-color:var(--good)}
.stage-row.now .stage-dot{background:var(--iri);color:#1a1a12;border-color:#e8df7a}
.stage-row.later{opacity:.6}
details>summary{cursor:pointer}

/* ---------- Lucky Clover speech bubbles: each character's colors and a little animation that fits them ---------- */
.clover .cface{position:relative;display:block;flex:none;transform-origin:50% 100%}
.clover .cface .art.face{display:block;position:relative;z-index:1}
.clover .cface i{position:absolute;pointer-events:none;display:block}
.clover .bubble{transition:background .3s}
/* Binko: a wind-up toy. Hops, squashes, and a little gear turns on his back */
.c-binko .cface{animation:cl-toy 1.6s ease-in-out infinite}
.c-binko .fx{right:-6px;top:6px;width:20px;height:20px;z-index:0;border-radius:50%;background:repeating-conic-gradient(#f0e278 0 22deg,transparent 22deg 45deg);animation:cl-spin 1.6s linear infinite}
.c-binko .fx2{left:-4px;top:-2px;color:#f2a7c3;font-style:normal;font-size:14px;z-index:2;animation:bk-twinkle 1.9s ease-in-out infinite}.c-binko .fx2::before{content:'✦'}
@keyframes cl-toy{0%,100%{transform:translateY(0) scale(1,1) rotate(0)}18%{transform:translateY(0) scale(1.08,.9) rotate(-4deg)}36%{transform:translateY(-9px) scale(.95,1.07) rotate(3deg)}54%{transform:translateY(0) scale(1.06,.93) rotate(0)}70%{transform:translateY(-3px) rotate(-2deg)}}
@keyframes cl-spin{to{transform:rotate(360deg)}}
/* Big Green: big slow breaths, a hungry chomp now and then, and his gold halo glowing */
.c-green .cface{animation:cl-breathe 4.2s ease-in-out infinite}
.c-green .cface .art.face{border-color:#c9a24a}
.c-green .fx{border-radius:50%;border:2px solid rgba(240,200,90,.55);animation:cl-halo 4.2s ease-in-out infinite}
@keyframes cl-breathe{0%,100%{transform:scale(1)}40%{transform:scale(1.05)}82%{transform:scale(1)}86%{transform:scale(1.03) rotate(-3deg)}90%{transform:scale(1) rotate(2deg)}94%{transform:rotate(0)}}
@keyframes cl-halo{0%,100%{opacity:.35;transform:scale(.96)}45%{opacity:1;transform:scale(1.04)}}
/* Ollie: fire. Flickering glow and embers rising off him */
.c-ollie .cface{animation:cl-flicker 2.2s ease-in-out infinite}
.c-ollie .cface .art.face{border-color:#e8833a}
.c-ollie .fx,.c-ollie .fx2{bottom:4px;width:10px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#ffe08a,#ff8a2b 55%,rgba(230,60,30,0) 72%);z-index:2;animation:cl-ember 1.7s ease-out infinite}
.c-ollie .fx{left:8px}.c-ollie .fx2{right:6px;animation-delay:.8s;width:8px;height:11px}
@keyframes cl-flicker{0%,100%{filter:drop-shadow(0 0 4px rgba(255,140,40,.5))}30%{filter:drop-shadow(0 0 10px rgba(255,90,30,.8))}55%{filter:drop-shadow(0 0 5px rgba(255,170,60,.55))}75%{filter:drop-shadow(0 0 12px rgba(255,110,30,.85))}}
@keyframes cl-ember{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-58px) translateX(6px) scale(.2)}}
/* Quickare: tips his top hat, and his monocle catches the light */
.c-quickare .cface{transform-origin:50% 90%}
.c-quickare .fx{left:20px;top:38%;color:#fff6c8;font-style:normal;font-size:13px;z-index:2;opacity:0;animation:cl-glint 3s ease-in-out infinite}.c-quickare .fx::before{content:'✦'}
@keyframes cl-tip{0%,60%,100%{transform:rotate(0)}68%{transform:rotate(-10deg) translateY(-3px)}78%{transform:rotate(4deg)}86%{transform:rotate(0)}}
@keyframes cl-glint{0%,40%,100%{opacity:0;transform:scale(.4)}48%{opacity:1;transform:scale(1.3) rotate(45deg)}56%{opacity:0;transform:scale(.4)}}
@keyframes cl-still{0%,100%{transform:translateX(0)}50%{transform:translateX(1px)}}
@keyframes cl-echo{0%{opacity:.5;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(16px,-6px) scale(1.12)}}
/* Captain Triton: rocks like a ship, pipe smoke curling up */
.c-triton .cface{animation:cl-sway 5s ease-in-out infinite}
.c-triton .cface .art.face{border-color:#b08d57}
.c-triton .fx,.c-triton .fx2{right:4px;top:4px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,rgba(150,220,150,.55),rgba(120,190,120,0) 68%);z-index:2;animation:cl-smoke 3.4s ease-out infinite}
.c-triton .fx2{animation-delay:1.7s;right:10px}
@keyframes cl-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes cl-smoke{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:.9}100%{opacity:0;transform:translate(-14px,-44px) scale(2.2)}}
@keyframes cl-hop{0%,75%,100%{transform:translateY(0) rotate(0)}10%{transform:translateY(-10px) rotate(-6deg)}20%{transform:translateY(0) rotate(2deg)}32%{transform:translateY(-10px) rotate(-6deg)}42%{transform:translateY(0) rotate(2deg)}54%{transform:translateY(-10px) rotate(-6deg)}64%{transform:translateY(0) rotate(3deg)}}
@keyframes cl-dust{0%,18%,40%,62%,100%{opacity:0;transform:scale(.6)}20%,42%,64%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.clover .cface,.clover .cface i{animation:none!important}.clover .cface i{display:none}}

/* ---------- the Today card takes on the look of whoever is talking ---------- */
.clover{align-items:center}.clover .cface{align-self:center}
.hero-guide .guide.clover::before{display:none}
.hero.h-binko,.hero.h-green,.hero.h-ollie,.hero.h-quickare,.hero.h-penn,.hero.h-triton,.hero.h-cat{background:var(--hbg);border-color:var(--hbd);transition:background .4s,border-color .4s}
.hero[class*=" h-"]::before{background:var(--hstripe);height:6px}
.hero[class*=" h-"] .btn{background:var(--hbtn);color:var(--hink);box-shadow:0 3px 0 var(--hshadow);border:var(--hbtnbd,0)}
.hero[class*=" h-"] .label{color:var(--hlabel)}
.hero[class*=" h-"] .hero-foot{border-top-color:var(--hline);color:var(--hlabel)}
.hero[class*=" h-"] .bubble .who{margin-bottom:4px}
/* Binko: a toy robot's screen panel, with rivets in the corners */
.hero.h-binko{--hbg:linear-gradient(160deg,#1e5550,#163c38 70%);--hbd:#2c6a62;--hstripe:var(--iri);--hbtn:var(--iri);--hink:#1a1a12;--hshadow:#9a5a3a;--hlabel:var(--muted);--hline:#2c6a62}
.c-binko .bubble{border-radius:18px;border:3px solid #2a9e8c;padding:12px 16px;background:radial-gradient(circle at 9px 9px,#2a9e8c 2.5px,transparent 3.5px),radial-gradient(circle at calc(100% - 9px) 9px,#2a9e8c 2.5px,transparent 3.5px),radial-gradient(circle at 9px calc(100% - 9px),#2a9e8c 2.5px,transparent 3.5px),radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),#2a9e8c 2.5px,transparent 3.5px),#f6f3e6;box-shadow:0 4px 0 #13403a}
/* Big Green: a big, rounded, scaly hide, gold trim and a purple-scarf stripe */
.hero.h-green{--hbg:radial-gradient(circle at 85% 0,rgba(201,162,74,.16),transparent 45%),linear-gradient(160deg,#25472f,#132619 75%);--hbd:#8a7232;--hstripe:linear-gradient(90deg,#c9a24a,#8e5bb0 40%,#8e5bb0 60%,#c9a24a);--hbtn:linear-gradient(180deg,#e2c06a,#b98c30);--hink:#1d1407;--hshadow:#5e4412;--hlabel:#a9c3a0;--hline:#3b5a3c}
.c-green .bubble{border-radius:34px 30px 38px 14px/30px 36px 30px 14px;border:3px solid #c9a24a;padding:14px 18px;color:#ece8d6;background:radial-gradient(circle at 10px 10px,rgba(255,255,255,.035) 7px,transparent 8px) 0 0/22px 18px,radial-gradient(circle at 21px 19px,rgba(255,255,255,.035) 7px,transparent 8px) 0 0/22px 18px,#1d3626;box-shadow:0 5px 0 #0c1a12}
.c-green .bubble .who{color:#c99be0}.c-green .bubble b{color:#f0d27a}
/* Ollie: an oleander petal, glowing like an ember */
.hero.h-ollie{--hbg:radial-gradient(circle at 90% 100%,rgba(255,120,40,.22),transparent 50%),linear-gradient(160deg,#4d1a1e,#250b0e 75%);--hbd:#9b4a2a;--hstripe:linear-gradient(90deg,#ff6a2b,#ffc65c 45%,#f49ac1);--hbtn:linear-gradient(90deg,#ff7e3a,#ffc35c);--hink:#2a0a05;--hshadow:#7c2410;--hlabel:#e9b7a8;--hline:#5e2a26}
.hero.h-ollie .btn{box-shadow:0 3px 0 #7c2410,0 0 18px rgba(255,140,50,.35)}
.c-ollie .bubble{border-radius:6px 40px 6px 40px;border:2px solid #e0a63e;padding:14px 20px;color:#f8e8dc;background:linear-gradient(160deg,#5a1a1e,#2c0d10);box-shadow:0 4px 0 #170506,0 0 22px rgba(255,120,40,.2)}
.c-ollie .bubble .who{color:#f49ac1}.c-ollie .bubble b{color:#ffc46b}
/* Quickare: a fancy gilded nameplate, the way a hill dwarf imagines nobility */
.hero.h-quickare{--hbg:radial-gradient(circle at 0 0,rgba(217,180,90,.14),transparent 40%),linear-gradient(160deg,#245039,#14301f 75%);--hbd:#b5944a;--hstripe:repeating-linear-gradient(135deg,#d9b45a 0 8px,#245039 8px 16px);--hbtn:linear-gradient(180deg,#2e6a4c,#1d4a33);--hink:#f6e6b8;--hshadow:#0e2418;--hbtnbd:2px solid #d9b45a;--hlabel:#b9cfa9;--hline:#3c6a4c}
.c-quickare .cface .art.face{border-color:#d9b45a}
.c-quickare .bubble{position:relative;border-radius:8px;border:4px double #d9b45a;padding:14px 20px;color:#f3ecd8;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 40%),#1c4230;box-shadow:0 4px 0 #0c2216}
.c-quickare .bubble::before,.c-quickare .bubble::after{content:'❦';position:absolute;color:#d9b45a;font-size:14px;line-height:1}

.c-quickare .bubble .who{color:#1c3a2a;background:linear-gradient(180deg,#f0d27a,#c9a24a);display:table;padding:1px 10px;border-radius:4px;letter-spacing:.06em}.c-quickare .bubble b{color:#f2c94c}
.hero.h-penn{--hbg:linear-gradient(160deg,#2c241e,#14100d 75%);--hbd:#5a4836;--hstripe:linear-gradient(90deg,#c9b58c,#8e2b2b 50%,#c9b58c);--hbtn:linear-gradient(180deg,#efe8d6,#cfc4a8);--hink:#221a16;--hshadow:#5e1d1d;--hlabel:#a99b86;--hline:#3e342b}
/* Captain Triton: a brass ship's plaque with a rope border, green smoke drifting through */
.hero.h-triton{--hbg:radial-gradient(circle at 12% 30%,rgba(120,190,120,.14),transparent 40%),linear-gradient(160deg,#28322f,#121816 75%);--hbd:#8a6d42;--hstripe:repeating-linear-gradient(-45deg,#c9a46a 0 5px,#7a5d33 5px 10px);--hbtn:linear-gradient(180deg,#dcbb82,#a8834a);--hink:#1d1a12;--hshadow:#4f3b1d;--hlabel:#a8b8a6;--hline:#36423d}
.c-triton .bubble{border-radius:20px;border:3px solid #b08d57;outline:2px dashed rgba(201,164,106,.55);outline-offset:-9px;padding:16px 20px;color:#e6e3d6;background:#27302d;box-shadow:0 4px 0 #0c100f}
.c-triton .bubble .who{color:#9fd39b}.c-triton .bubble b{color:#e0bf86}
.hero.h-cat{--hbg:linear-gradient(160deg,#5c4535,#33251b 75%);--hbd:#9c8466;--hstripe:repeating-linear-gradient(90deg,#efe6d2 0 14px,transparent 14px 24px);--hbtn:linear-gradient(180deg,#f6eedc,#dccdaa);--hink:#3a2b20;--hshadow:#20160f;--hlabel:#d4c3a8;--hline:#6a5340}

/* ---------- spacing: every face keeps clear of its bubble, halos and glows included ---------- */
.clover{gap:24px}.clover .cface{margin:12px 2px 12px 12px}
.c-green .fx{inset:-6px}
/* livelier Quickare idle: a jaunty bob and his hat-tip */
.c-quickare .cface{animation:cl-tip 3s ease-in-out infinite,cl-jaunt 1.5s ease-in-out infinite}
@keyframes cl-jaunt{0%,100%{translate:0 0}50%{translate:0 -3px}}
/* ---------- special moves ---------- */
.cface .pt{position:absolute;left:50%;top:50%;z-index:3;font-style:normal;font-weight:700;font-size:16px;line-height:1;pointer-events:none;opacity:0;animation:pt-burst 1.1s ease-out forwards}
@keyframes pt-burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(1.1)}}
.pt.rainbow:nth-child(6n+1){color:#ff6b6b}.pt.rainbow:nth-child(6n+2){color:#ffb347}.pt.rainbow:nth-child(6n+3){color:#f0e278}.pt.rainbow:nth-child(6n+4){color:#7ee08a}.pt.rainbow:nth-child(6n+5){color:#6cc4ee}.pt.rainbow:nth-child(6n){color:#c58cf2}
.pt.note{color:#f2a7c3;font-size:18px}.pt.note.sea{color:#9fd39b}.pt.heal{color:#7ee08a;text-shadow:0 0 6px #7ee08a}.pt.gold{color:#f0d27a}
.pt.surge:nth-child(3n){color:#ff7ad9}.pt.surge:nth-child(3n+1){color:#7af0ff}.pt.surge:nth-child(3n+2){color:#ffd36b}
.pt.fire{font-size:15px}.pt.petal{color:#f7a8c8;font-size:15px;animation-duration:1.6s}.pt.flash{color:#fff3a8;font-size:22px;text-shadow:0 0 10px #ffd84a;animation-duration:.45s}
.popword{position:absolute;left:50%;top:-6px;z-index:4;font-family:var(--f-display);font-weight:800;font-size:17px;white-space:nowrap;pointer-events:none;animation:pop-word 1.2s ease-out forwards}
.popword.green{color:#f0d27a;text-shadow:0 2px 0 #1d3626}.popword.bang{color:#ffd84a;text-shadow:0 2px 0 #7a2a12}.popword.cat{color:#f6efe0;text-shadow:0 2px 0 #3a2b20}
@keyframes pop-word{0%{opacity:0;transform:translate(-50%,10px) scale(.4) rotate(-8deg)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.2) rotate(4deg)}70%{opacity:1;transform:translate(-50%,-10px) scale(1)}100%{opacity:0;transform:translate(-50%,-18px)}}

.cface.sp-rainbow .art.face{animation:sp-hue 1.6s linear}
@keyframes sp-hue{0%{filter:hue-rotate(0) saturate(1.4)}100%{filter:hue-rotate(360deg) saturate(1)}}

.cface .hat{position:absolute;left:50%;top:0;z-index:4;font-style:normal;font-size:26px;pointer-events:none;animation:sp-hat 1.3s cubic-bezier(.3,.7,.4,1) forwards}

  .rush-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
  .rush-hero .btn{width:auto;align-self:flex-start;padding-inline:36px}
  /* lessons: one centered column, big word, answers in a 2x2 grid, the main button right under them */
  .app.lesson{max-width:720px;min-height:calc(100vh - 56px)}
  .app.lesson .sbar{background:transparent;margin-bottom:auto}
  .app.lesson .foot{margin-bottom:auto}
  /* screens with no bottom panel (speed round, placement, numbers…): keep the question centred instead of sinking to the bottom */
  .app.lesson:not(:has(> .foot:not([hidden]))) > .ex{margin-bottom:auto}
  .app.lesson:has(input.field,#ans,textarea) .playrow::after{content:none}
  .app.lesson .ex{justify-content:center;min-height:0;padding-top:4vh}
  .app.lesson .ceb{font-size:3.2rem}
  .app.lesson .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .app.lesson .opts{counter-reset:o}
  .app.lesson .opt{display:flex;align-items:center;gap:12px}
  .app.lesson .opt::before{counter-increment:o;content:counter(o);flex:none;width:28px;height:28px;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-size:.85rem;font-weight:700;color:var(--muted)}
  .app.lesson .foot{position:static;border-radius:16px;border:2px solid var(--line)}
  .app.lesson .foot .btn.primary::after{content:'Enter';font:700 .7rem var(--f-body);border:1px solid currentColor;border-radius:6px;padding:0 6px;margin-left:10px;opacity:.7}
  .app.lesson .playrow::after{content:'Space replays · S slow';font-size:.8rem;color:var(--muted);margin-left:auto}
}
</style>
